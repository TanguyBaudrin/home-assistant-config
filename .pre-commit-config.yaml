# Hooks pre-commit locaux.
#
# Les regles yamllint (et les exclusions des blueprints tiers) sont definies
# dans .yamllint, et non ici. La CI (.github/workflows/ci.yml) execute
# exactement la meme commande, en mode strict.
#
#   pre-commit install
#   pre-commit run --all-files

repos:
  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["--strict"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict

  # Bloque un secret des le `git commit`. La version visee est celle epinglee
  # dans mise.toml (`language: system`), comme yamllint l'est dans la CI.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system
        # Amont (v8.30.1) oublie `pass_filenames: false` sur ce hook, present
        # sur `gitleaks` et `gitleaks-docker` : sans cette ligne, pre-commit
        # passe les fichiers en argument et gitleaks refuse (« accepts at most
        # 1 arg »). Le scan porte sur le diff indexe, pas sur une liste de
        # fichiers.
        pass_filenames: false
