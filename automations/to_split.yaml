- id: '1766595380189'
  alias: Auto - Salon - Eteindre la lumière si on lance une vidéo sur Jellyfin
  description: |
    Désactive les automatismes lumineux du salon quand une vidéo est lancée sur Jellyfin.
    Restaure les automatismes uniquement si la lecture a été interrompue et non pas si une
    autre automation (ex: volets le matin) a désactivé les lumières entre temps.
    (Modifié le 2026-03-06)
  triggers:
  - trigger: state
    entity_id:
    - media_player.tv_du_salon_2
    to:
    - playing
    id: lance_lecture
  - trigger: state
    entity_id:
    - media_player.tv_du_salon_2
    from:
    - playing
    id: stop_lecture
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - lance_lecture
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.lumieres_desactivees_par_media
      - action: automation.turn_off
        metadata: {}
        target:
          entity_id: automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
        data:
          stop_actions: true
      - action: light.turn_off
        metadata: {}
        target:
          area_id: salon
        data: {}
    - conditions:
      - condition: trigger
        id:
        - stop_lecture
      - condition: state
        entity_id: input_boolean.lumieres_desactivees_par_media
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.lumieres_desactivees_par_media
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
        data: {}
      - action: light.turn_on
        metadata: {}
        target:
          area_id: salon
        data: {}
  mode: single
- id: '1767091174755'
  alias: "Auto - Garage - Heures creuses Tempo \U0001F534"
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.rte_tempo_heures_creuses
    to:
    - 'on'
    id: heures_creuses
    from:
    - 'off'
  - trigger: state
    entity_id:
    - binary_sensor.rte_tempo_heures_creuses
    to:
    - 'off'
    id: heure_pleines
    from:
    - 'on'
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - choose:
    - conditions:
      - alias: "Passage en HC bleues/blanches/rouges \U0001F535 ⚪️ \U0001F534"
        condition: and
        conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state:
          - Bleu
          - Blanc
          - Rouge
        - condition: trigger
          id:
          - heures_creuses
      sequence:
      - parallel:
        - sequence:
          - action: automation.turn_on
            metadata: {}
            target:
              entity_id:
              - automation.grenier_automatisation_de_la_vmc
              - automation.auto_grenier_vmc_reguler_la_vitesse_en_fonction_de_lhumidite
            data: {}
          - action: input_select.select_option
            metadata: {}
            target:
              entity_id: input_select.interrupteur_vmc
            data:
              option: Vitesse 1
          alias: Rallumer VMC
        - parallel:
          - action: automation.turn_on
            metadata: {}
            target:
              entity_id:
              - automation.auto_bureau_prise_tanguy_gestion_de_l_allumage_extinction_en_automatique_de_la_prise
              - automation.auto_bureau_prise_bureau_agnes_automatiser_l_allumage_extinction_de_la_prise
            data: {}
          alias: Automatisations prises du bureau
        - alias: Allumer les serveurs
          sequence:
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.multiprise_garage_serveurs
            data: {}
          - delay:
              hours: 0
              minutes: 1
              seconds: 0
              milliseconds: 0
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id:
              - switch.prise_routeur_cisco_poe
            data: {}
          - wait_template: '{{ is_state("sensor.borne_du_bureau_state", "Connected")
              }}'
            continue_on_timeout: false
            timeout: '3600'
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.prise_nas_asustor
            data: {}
          - wait_template: '{{ is_state("binary_sensor.nas_asustor", "on") }}'
            continue_on_timeout: true
          - action: switch.turn_on
            metadata: {}
            target:
              entity_id: switch.prise_serveur_dell_commutateur
            data: {}
        - action: switch.turn_on
          metadata: {}
          target:
            label_id: auto_on_jour_rouge
          data: {}
      alias: "Passage en HC bleues/blanches/rouges \U0001F535 ⚪️ \U0001F534"
    - conditions:
      - alias: "Passage en HP rouge \U0001F534"
        condition: and
        conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state:
          - Rouge
        - condition: trigger
          id:
          - heure_pleines
      sequence:
      - parallel:
        - action: switch.turn_off
          metadata: {}
          target:
            label_id: off_jour_rouge
          data: {}
        - alias: Eteindre les serveurs
          sequence:
          - action: button.press
            metadata: {}
            target:
              entity_id: button.node_proxmox_pve_shutdown
            data: {}
          - wait_template: '{{ is_state("sensor.prise_serveur_dell_courant", "0.0")}}'
            continue_on_timeout: false
            timeout: '3600'
          - action: shell_command.asustor_shutdown
            metadata: {}
            data: {}
          - wait_template: '{{ is_state("sensor.prise_nas_asustor_courant", "0.0")}}'
            continue_on_timeout: false
            timeout: '3600'
          - action: switch.turn_off
            metadata: {}
            target:
              entity_id:
              - switch.prise_serveur_dell_commutateur
              - switch.prise_routeur_cisco_poe
              - switch.prise_nas_asustor
            data: {}
        - sequence:
          - action: automation.turn_off
            metadata: {}
            target:
              entity_id:
              - automation.auto_grenier_vmc_reguler_la_vitesse_en_fonction_de_lhumidite
              - automation.grenier_automatisation_de_la_vmc
            data:
              stop_actions: true
          - action: input_select.select_option
            metadata: {}
            target:
              entity_id: input_select.interrupteur_vmc
            data:
              option: 'Off'
          alias: Couper la VMC
        - parallel:
          - action: automation.turn_off
            metadata: {}
            target:
              entity_id:
              - automation.auto_bureau_prise_tanguy_gestion_de_l_allumage_extinction_en_automatique_de_la_prise
              - automation.auto_bureau_prise_bureau_agnes_automatiser_l_allumage_extinction_de_la_prise
            data:
              stop_actions: true
          alias: Automatisations prises du bureau
  mode: single
