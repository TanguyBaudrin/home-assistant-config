- id: '1699818890314'
  alias: Auto - Maison - Arlo - Gestion des modes arlo
  description: ''
  triggers:
  - event: sunrise
    id: soleil_se_lève
    trigger: sun
  - at: input_datetime.heure_de_reveil_de_la_maison
    id: heure_de_réveil
    trigger: time
  - event: sunset
    offset: 00:00
    trigger: sun
    id: soleil_se_couche
  - trigger: time
    at: '22:00:00'
    id: heure_de_coucher
  - trigger: zone
    entity_id: person.agnes
    zone: zone.home
    event: enter
    id: agnes_rentre
  - trigger: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: enter
    id: tanguy_rentre
  - trigger: zone
    entity_id: person.agnes
    zone: zone.home
    event: leave
    id: agnes_quitte
  - trigger: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: leave
    id: tanguy_quitte
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: zone
          entity_id: person.agnes
          zone: zone.home
        - condition: zone
          entity_id: person.tanguy_baudrin
          zone: zone.home
        alias: Quelqu'un est à la maison
      - alias: Déclenché le matin
        condition: or
        conditions:
        - alias: Déclenché par le soleil après l'heure de réveil de la maison
          condition: and
          conditions:
          - condition: trigger
            id:
            - soleil_se_lève
          - condition: time
            after: input_datetime.heure_de_reveil_de_la_maison
        - alias: Déclenché à 7h15, et le soleil est déjà levé
          condition: and
          conditions:
          - condition: trigger
            id:
            - heure_de_réveil
          - condition: sun
            after: sunrise
        - condition: trigger
          id:
          - agnes_rentre
          - tanguy_rentre
      sequence:
      - action: alarm_control_panel.alarm_arm_home
        metadata: {}
        data: {}
        target:
          device_id: 9243b1e92ae159a2e333ccf8988a65ed
    - conditions:
      - condition: trigger
        id:
        - soleil_se_couche
        - heure_de_coucher
      - condition: or
        conditions:
        - condition: zone
          entity_id: person.agnes
          zone: zone.home
        - condition: zone
          entity_id: person.tanguy_baudrin
          zone: zone.home
        alias: Quelqu'un est à la maison
      sequence:
      - action: alarm_control_panel.alarm_arm_night
        metadata: {}
        data: {}
        target:
          device_id: 9243b1e92ae159a2e333ccf8988a65ed
    default:
    - action: alarm_control_panel.alarm_arm_away
      metadata: {}
      data: {}
      target:
        device_id: 9243b1e92ae159a2e333ccf8988a65ed
  mode: single


- id: '1699870051044'
  alias: '[Maison] Automatisation du planning de chauffage'
  description: 'Automatisation pour gérer le planning du chauffage, actuellement le
    fonctionnement est le suivant.

    A 5h du matin, on vérifie différentes options:

    - Est-ce qu''il ya un événement "Télétravail" en cours ? => Si oui, on passe en
    planning télétravail sur Netatmo

    - Dans les autres cas => On mets en planning "Quotidien" sur Netatmo'
  trigger:
  - platform: time
    at: 05:00:00
  condition: []
  action:
  - choose:
    - conditions:
      - alias: Il y a un évènement en cours dans l'agenda, et son objet est "Télétravail"
        condition: and
        conditions:
        - condition: state
          entity_id: calendar.maison
          state: 'on'
          alias: Un événement est en cours
        - condition: state
          entity_id: calendar.maison
          attribute: message
          state: Télétravail
          alias: Un rendez-vous est en cours avec comme objet "Télétravail"
      sequence:
      - service: netatmo.set_schedule
        data:
          schedule_name: Télétravail
        target:
          area_id:
          - bureau
          - chambre_louis
          - chambre_maxime
          - chambre_parents
          - entree
          - salle_a_manger
        alias: Passage au planning "Télétravail"
    - conditions:
      - alias: Il y a un évènement en cours dans l'agenda, et son objet est "Télétravail"
        condition: and
        conditions:
        - condition: state
          entity_id: calendar.maison
          state: 'on'
          alias: Un événement est en cours
        - alias: Un rendez-vous est en cours avec comme objet "Congés"
          condition: state
          entity_id: calendar.maison
          attribute: message
          state: Congés
      sequence:
      - alias: Passage au planning "Vacances"
        service: netatmo.set_schedule
        data:
          schedule_name: Vacances
        target:
          area_id:
          - bureau
          - chambre_louis
          - chambre_maxime
          - chambre_parents
          - entree
          - salle_a_manger
    default:
    - service: netatmo.set_schedule
      data:
        schedule_name: Quotidien
      target:
        area_id:
        - bureau
        - chambre_louis
        - chambre_maxime
        - chambre_parents
        - entree
        - salle_a_manger
      alias: Passage au planning "Quotidien" côté netatmo
  mode: single

