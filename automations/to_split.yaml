        - A 7h
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vitesse 1
        target:
          entity_id: input_select.interrupteur_vmc
    - conditions:
      - condition: trigger
        id:
        - Tanguy rentre
        - Agnès rentre
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vitesse 1
        target:
