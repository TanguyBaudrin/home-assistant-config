    at: '23:00:00'
    id: A 23h
  - trigger: time
    at: 07:00:00
    id: A 7h
  - trigger: zone
    entity_id: person.agnes
    zone: zone.home
    event: leave
    id: Agnes part
  - trigger: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: leave
    id: Tanguy part
  - trigger: zone
    entity_id: person.agnes
    zone: zone.home
    event: enter
    id: Agnès rentre
  - trigger: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: enter
    id: Tanguy rentre
  conditions: []
  actions:
  - choose:
    - conditions:
      - alias: Si déclenché par 23h ou départ, et personne n'est à la maison, ou il
          est passé 23h
        condition: and
        conditions:
        - alias: Agnès et tanguy sont absent, ou il est passé 23h
          condition: or
          conditions:
          - condition: time
            after: '22:59:00'
          - condition: and
            conditions:
            - condition: not
              conditions:
              - condition: zone
                entity_id: person.agnes
                zone: zone.home
              alias: Agnès n'est pas à la maison
            - condition: not
              conditions:
              - condition: zone
                entity_id: person.tanguy_baudrin
                zone: zone.home
              alias: Tanguy n'est pas à la maison
            alias: Agnès et Tanguy ne sont pas là
        - condition: trigger
          id:
          - A 23h
          - Agnes part
          - Tanguy part
      sequence:
      - delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0
      - action: input_select.select_option
        metadata: {}
        data:
          option: 'Off'
        target:
          entity_id: input_select.interrupteur_vmc
