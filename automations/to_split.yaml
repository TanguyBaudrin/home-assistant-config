- id: '1735821043121'
  alias: Notification - Global - Batterie - Alertes quand les piles doivent être remplacées
  description: Battery Low Notification with auto dismiss
  triggers:
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: true
    id: low
    alias: Battery went low
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: false
    id: high
    alias: Battery went high
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - low
      sequence:
      - action: notify.mobile_app_iphone_pro_de_tanguy
        metadata: {}
        data:
          title: '{{ trigger.event.data.device_name }} Battery Low

            '
          notification_id: '{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
            }}'
          message: 'The device has a battery level of {{ trigger.event.data.battery_level
            }}% {{ ''\n'' -}} You need {{ trigger.event.data.battery_quantity }}x
            {{ trigger.event.data.battery_type }}

            '
      - action: persistent_notification.create
        data:
          title: '{{ trigger.event.data.device_name }} Battery Low

            '
          notification_id: '{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
            }}'
          message: 'The device has a battery level of {{ trigger.event.data.battery_level
            }}% {{ ''\n'' -}} You need {{ trigger.event.data.battery_quantity }}x
            {{ trigger.event.data.battery_type }}

            '
    - conditions:
      - condition: trigger
        id:
        - high
      sequence:
      - action: persistent_notification.dismiss
        data:
          notification_id: '{{ trigger.event.data.device_id }}-{{ trigger.event.data.source_entity_id
            }}'
  mode: queued
- id: '1736019595242'
  alias: Tech - Chambre parents - Hue smart button - Actions sur appuie sur le bouton
  description: ''
  triggers:
  - event_type:
    - deconz_event
    - zha_event
    event_data:
      device_id: 9889704f550783eeb7a0fef44c78ebbb
    trigger: event
  conditions:
  - condition: template
    value_template: '{%- set trigger_action -%} {%- if integration_id == "zigbee2mqtt"
      -%} {{ trigger.event.data.new_state.state }} {%- elif integration_id == "deconz"
      -%} {{ trigger.event.data.event }} {%- elif integration_id == "zha" -%} {{ trigger.event.data.command
      }} {%- endif -%} {%- endset -%} {{ trigger_action not in ["","None"] }}'
  actions:
  - delay:
      milliseconds: 0
  - variables:
      trigger_action: '{%- if integration_id == "zigbee2mqtt" -%} {{ trigger.event.data.new_state.state
        }} {%- elif integration_id == "deconz" -%} {{ trigger.event.data.event }}
        {%- elif integration_id == "zha" -%} {{ trigger.event.data.command }} {%-
        endif -%}'
      trigger_delta: '{{ (as_timestamp(now()) - ((states(helper_last_controller_event)
        | from_json).t if helper_last_controller_event is not none and (states(helper_last_controller_event)
        | regex_match("^\{((\"a\": \".*\"|\"t\": \d+\.\d+)(, )?){2}\}$")) else as_timestamp("1970-01-01
        00:00:00"))) * 1000 }}'
  - data:
      entity_id: input_text.last_smart_button_event
      value: '{{ {"a":trigger_action,"t":as_timestamp(now())} | to_json }}'
    action: input_text.set_value
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger_action | string in button_short }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ button_double_press }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ trigger_action | string in states(helper_last_controller_event)
                  and trigger_delta | int <= helper_double_press_delay | int }}'
              sequence:
              - data:
                  entity_id: input_text.last_smart_button_event
                  value: '{{ {"a":"double_press","t":as_timestamp(now())} | to_json
                    }}'
                action: input_text.set_value
              - event: ahb_controller_event
                event_data:
                  controller: '{{ controller_id }}'
                  action: button_double
              - choose:
                - conditions: []
                  sequence: []
            default:
            - delay:
                milliseconds: '{{ adjusted_double_press_delay }}'
            - event: ahb_controller_event
              event_data:
                controller: '{{ controller_id }}'
                action: button_short
            - choose:
              - conditions: []
                sequence: []
        default:
        - event: ahb_controller_event
          event_data:
            controller: '{{ controller_id }}'
            action: button_short
        - choose:
          - conditions: []
            sequence: []
    - conditions:
      - condition: template
        value_template: '{{ trigger_action | string in button_long }}'
      sequence:
      - event: ahb_controller_event
        event_data:
          controller: '{{ controller_id }}'
          action: button_long
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ button_long_loop }}'
          sequence:
          - repeat:
              while:
              - condition: template
                value_template: '{{ repeat.index < button_long_max_loop_repeats |
                  int }}'
              sequence: []
        default: []
    - conditions:
      - condition: template
        value_template: '{{ trigger_action | string in button_release }}'
      sequence:
      - event: ahb_controller_event
        event_data:
          controller: '{{ controller_id }}'
          action: button_release
      - choose:
        - conditions: []
          sequence:
          - action: automation.trigger
            metadata: {}
            data:
              skip_condition: true
            target:
              entity_id: automation.auto_chambre_parents_apple_tv_mettre_en_route_l_apple_tv
  variables:
    integration: ZHA
    button_long_loop: false
    button_long_max_loop_repeats: 500
    button_double_press: false
    helper_last_controller_event: input_text.last_smart_button_event
    helper_double_press_delay: 500
    helper_debounce_delay: 0
    integration_id: '{{ integration | lower }}'
    adjusted_double_press_delay: '{{ [helper_double_press_delay - helper_debounce_delay,
      100] | max }}'
    actions_mapping:
      deconz:
        button_short:
        - '1000'
        button_long:
        - '1001'
        button_release:
        - '1003'
      zha:
        button_short:
        - on_short_release
        button_long:
        - on_hold
        button_release:
        - on_long_release
    button_short: '{{ actions_mapping[integration_id]["button_short"] }}'
    button_long: '{{ actions_mapping[integration_id]["button_long"] }}'
    button_release: '{{ actions_mapping[integration_id]["button_release"] }}'
    controller_device: ac8c8824a5af5973b34d051003752d2b
    controller_id: '{{controller_device}}'
  mode: restart
  max_exceeded: silent
- id: '1736799359847'
  alias: 'Auto - Grenier - VMC - réguler la vitesse en fonction de l’humidité '
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.ewelink_snzb_02p_humidite_2
    for:
      hours: 0
      minutes: 1
      seconds: 0
    above: 70
    id: Humidité haute
  - trigger: numeric_state
    entity_id:
    - sensor.ewelink_snzb_02p_humidite_2
    id: Humidité basse
    below: 70
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - Humidité haute
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vitesse 2
        target:
          entity_id: input_select.interrupteur_vmc
    - conditions:
      - condition: trigger
        id:
        - Humidité basse
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vitesse 1
        target:
          entity_id: input_select.interrupteur_vmc
  mode: single

