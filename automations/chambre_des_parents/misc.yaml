- id: 'auto_chambre_des_parents_alerte_humidite'
  alias: Chambre des parents - Humidité - Alerte quand l'humidité est trop importante
  description: >-
    Cette automatisation envoie une notification sur les téléphones d'Agnès et
    Tanguy lorsque le taux d'humidité de la chambre des parents dépasse 60 %
    pendant 20 minutes. (Migré le 2026-10-18)
  trigger:
  - entity_id:
    - sensor.ewelink_snzb_02p_humidite
    for:
      hours: 0
      minutes: 20
      seconds: 0
    above: 60
    trigger: numeric_state
  condition: []
  action:
  - action: notify.mobile_app_iphone_de_agnes
    data:
      message: 'Humidité dans la chambre des parents trop importante '
      title: "\U0001F6A8 humidité dans la chambre"
  - action: notify.mobile_app_iphone_pro_de_tanguy
    data:
      message: 'Humidité dans la chambre des parents trop importante '
      title: "\U0001F6A8 humidité dans la chambre"
  mode: single
- id: 'auto_chambre_des_parents_compteur_jours_aeration_reset'
  alias: Chambre des parents - Aération - Réinitialisation du compteur jours sans aération
  description: >-
    Cette automatisation réinitialise le compteur de jours sans aération
    (counter.jours_sans_aeration) lorsque la variation d'humidité de la chambre
    des parents descend en dessous de -4 %, indiquant une aération récente.
    (Migré le 2026-10-24)
  trigger:
  - trigger: numeric_state
    entity_id:
    - sensor.changement_humidite_chambre_des_parents
    below: -4
  condition: []
  action:
  - action: counter.reset
    target:
      entity_id: counter.jours_sans_aeration
    data: {}
  mode: single
