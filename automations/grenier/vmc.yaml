- id: 'auto_grenier_vmc_verification_consommation'
  alias: "Auto - Grenier - VMC - Vérification de la consommation après changement de vitesse"
  description: |
    Vérifie que la VMC consomme bien de l'énergie après un changement de vitesse.
    Si aucune consommation n'est détectée, tente de relancer la VMC en basculant
    temporairement sur l'autre vitesse puis en revenant à la vitesse d'origine.
    Après 3 tentatives infructueuses, envoie une notification d'alerte sur les
    iPhones de Tanguy et Agnès.
    (Créé le 2026-06-01)
  trigger:
    - id: vitesse_change
      trigger: state
      entity_id: input_select.interrupteur_vmc
      to: "Vitesse 1"
    - id: vitesse_change
      trigger: state
      entity_id: input_select.interrupteur_vmc
      to: "Vitesse 2"
  condition:
    - alias: Capteur de puissance disponible
      condition: template
      value_template: >
        {{ states('sensor.module_vmc_puissance') not in ['unavailable',
           'unknown', 'none', None] }}
  action:
    - variables:
        requested_speed: "{{ trigger.to_state.state }}"
        max_retries: 3
        power_threshold: 5
        spin_up_delay_seconds: 60
        retry_delay_seconds: 5
    - alias: Boucle de vérification avec relance
      repeat:
        count: "{{ max_retries }}"
        sequence:
          - alias: Attendre le temps de démarrage de la VMC
            delay:
              seconds: "{{ spin_up_delay_seconds }}"
          - alias: Vérifier la consommation
            choose:
              - conditions:
                  - alias: La VMC consomme de l'énergie
                    condition: template
                    value_template: >
                      {{ states('sensor.module_vmc_puissance') | float(0) > power_threshold | float(0) }}
                sequence:
                  - alias: Arrêter la boucle, VMC fonctionnelle
                    stop: "VMC OK - consommation détectée"
              - conditions:
                  - alias: Toujours aucune consommation après les tentatives
                    condition: template
                    value_template: "{{ repeat.index == max_retries }}"
                sequence:
                  - alias: Notification d'alerte aux iPhones
                    repeat:
                      for_each:
                        - notify.mobile_app_iphone_pro_de_tanguy
                        - notify.mobile_app_iphone_de_tanguy
                        - notify.mobile_app_iphone_de_agnes
                      sequence:
                        - action: "{{ repeat.item }}"
                          data:
                            title: "⚠️ VMC - Problème détecté"
                            message: >
                              La VMC ne semble pas consommer d'énergie après
                              {{ max_retries }} tentatives de relance.
                              Vitesse demandée : {{ requested_speed }}.
                              Veuillez vérifier le module VMC dans le grenier.
                            data_template:
                              tag: "vmc_alert"
                              importance: high
                  - alias: Sortir après notification
                    stop: "VMC en panne - notification envoyée"
          - alias: Relance - basculer sur l'autre vitesse
            choose:
              - conditions:
                  - alias: Vitesse demandée Vitesse 1 - passer à Vitesse 2
                    condition: template
                    value_template: "{{ requested_speed == 'Vitesse 1' }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.interrupteur_vmc
                    data:
                      option: "Vitesse 2"
              - conditions:
                  - alias: Vitesse demandée Vitesse 2 - passer à Vitesse 1
                    condition: template
                    value_template: "{{ requested_speed == 'Vitesse 2' }}"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.interrupteur_vmc
                    data:
                      option: "Vitesse 1"
          - alias: Pause avant de revenir à la vitesse d'origine
            delay:
              seconds: "{{ retry_delay_seconds }}"
          - alias: Revenir à la vitesse d'origine
            action: input_select.select_option
            target:
              entity_id: input_select.interrupteur_vmc
            data:
              option: "{{ requested_speed }}"
  mode: restart

- id: 'vmc_commute_management'
  alias: Mode - Grenier - VMC - Gestion des commutateurs
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_select.interrupteur_vmc
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.interrupteur_vmc
        state: 'Off'
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.module_vmc_commutateur_lent
          - switch.module_vmc_commutateur_rapide
    - conditions:
      - condition: state
        entity_id: input_select.interrupteur_vmc
        state: Vitesse 1
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.module_vmc_commutateur_rapide
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.module_vmc_commutateur_lent
    - conditions:
      - condition: state
        entity_id: input_select.interrupteur_vmc
        state: Vitesse 2
      sequence:
      - action: switch.turn_off
        metadata: {}
        data: {}
        target:
          entity_id:
          - switch.module_vmc_commutateur_lent
      - delay:
          hours: 0
          minutes: 0
          seconds: 5
          milliseconds: 0
      - action: switch.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: switch.module_vmc_commutateur_rapide
  mode: single


- id: 'vmc_auto_speed'
  alias: Auto - Grenier - VMC - Gestion des différentes vitesses
  description: ''
  triggers:
  - trigger: time
    at: '23:00:00'
    id: A 23h
  - trigger: time
    at: 07:00:00
    id: A 7h
  - trigger: zone
    entity_id: person.agnes
    zone: zone.home
    event: leave
    id: Agnes part
  - trigger: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: leave
    id: Tanguy part
  - trigger: zone
    entity_id: person.agnes
    zone: zone.home
    event: enter
    id: Agnès rentre
  - trigger: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: enter
    id: Tanguy rentre
  conditions: []
  actions:
  - choose:
    - conditions:
      - alias: Si déclenché par 23h ou départ, et personne n'est à la maison, ou il
          est passé 23h
        condition: and
        conditions:
        - alias: Agnès et tanguy sont absent, ou il est passé 23h
          condition: or
          conditions:
          - condition: time
            after: '22:59:00'
          - condition: and
            conditions:
            - condition: not
              conditions:
              - condition: zone
                entity_id: person.agnes
                zone: zone.home
              alias: Agnès n'est pas à la maison
            - condition: not
              conditions:
              - condition: zone
                entity_id: person.tanguy_baudrin
                zone: zone.home
              alias: Tanguy n'est pas à la maison
            alias: Agnès et Tanguy ne sont pas là
        - condition: trigger
          id:
          - A 23h
          - Agnes part
          - Tanguy part
      sequence:
      - delay:
          hours: 0
          minutes: 30
          seconds: 0
          milliseconds: 0
      - action: input_select.select_option
        metadata: {}
        data:
          option: 'Off'
        target:
          entity_id: input_select.interrupteur_vmc
    - conditions:
      - condition: trigger
        id:
        - A 7h
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vitesse 1
        target:
          entity_id: input_select.interrupteur_vmc
    - conditions:
      - condition: trigger
        id:
        - Tanguy rentre
        - Agnès rentre
      sequence:
      - action: input_select.select_option
        metadata: {}
        data:
          option: Vitesse 1
        target:
          entity_id: input_select.interrupteur_vmc
  mode: restart