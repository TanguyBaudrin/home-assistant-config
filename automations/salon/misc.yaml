- id: 'auto_salon_cast_meteo'
  alias: 'Salon - Cast - Afficher la météo sur le Nest Hub'
  description: |
    Affiche le tableau de bord météo de Wasquehal sur le Nest Hub du salon
    entre 7h et 8h15, puis éteint l'appareil. (Migré le 2026-10-17)
  trigger:
    - at: '07:00:00'
      id: allumage
      trigger: time
    - at: '08:15:00'
      id: extinction
      trigger: time
  condition: []
  action:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - allumage
          sequence:
            - action: cast.show_lovelace_view
              data:
                entity_id: media_player.sejour
                dashboard_path: meteo-wasquehal
                view_path: cast
        - conditions:
            - condition: trigger
              id:
                - extinction
          sequence:
            - action: media_player.turn_off
              target:
                entity_id: media_player.sejour
  mode: single
