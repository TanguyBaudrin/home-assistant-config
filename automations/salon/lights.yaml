- id: 'light_salon_auto'
  alias: '[Salon] Gestion de la lumière avec capteur de présence'
  description: ''
  mode: restart
  triggers:
  - type: occupied
    device_id: 980a0228024674ae9c7c9020e34567d3
    entity_id: binary_sensor.presence_sensor_fp2_d3fe_presence_sensor_3
    domain: binary_sensor
    trigger: device
    id: Occupé
  conditions: []
  actions:
  - action: light.turn_on
    target:
      area_id: salle_a_manger
  - wait_for_trigger:
    - entity_id: binary_sensor.presence_sensor_fp2_d3fe_presence_sensor_3
      to: "off"
      for:
        seconds: 120
      trigger: state
    timeout:
      hours: 1
    continue_on_timeout: false
  - action: light.turn_off
    target:
      area_id: salle_a_manger
- id: 'auto_salon_lumieres_media_jellyfin'
  alias: 'Salon - Lumières - Extinction des lumières lors du lancement d''une vidéo'
  description: |
    Désactive les automatismes lumineux du salon quand une vidéo est lancée sur
    Jellyfin. Restaure les automatismes uniquement si la lecture a été interrompue
    et non pas si une autre automation (ex: volets le matin) a désactivé les lumières
    entre temps. (Migré le 2026-10-23)
  trigger:
  - platform: state
    entity_id:
    - media_player.tv_du_salon_2
    to: playing
    id: lance_lecture
  - platform: state
    entity_id:
    - media_player.tv_du_salon_2
    from: playing
    id: stop_lecture
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - lance_lecture
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.lumieres_desactivees_par_media
      - action: automation.turn_off
        metadata: {}
        target:
          entity_id: automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
        data:
          stop_actions: true
      - action: light.turn_off
        metadata: {}
        target:
          area_id: salon
        data: {}
    - conditions:
      - condition: trigger
        id:
        - stop_lecture
      - condition: state
        entity_id: input_boolean.lumieres_desactivees_par_media
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.lumieres_desactivees_par_media
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
        data: {}
      - action: light.turn_on
        metadata: {}
        target:
          area_id: salon
        data: {}
  mode: single
