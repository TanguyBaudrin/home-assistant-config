
- id: 'light_salon_auto'
  alias: '[Salon] Gestion de la lumière avec capteur de présence'
  description: ''
  mode: restart
  triggers:
  - type: occupied
    device_id: 980a0228024674ae9c7c9020e34567d3
    entity_id: binary_sensor.presence_sensor_fp2_d3fe_presence_sensor_3
    domain: binary_sensor
    trigger: device
    id: Occupé
  conditions: []
  actions:
  - action: light.turn_on
    target:
      area_id: salle_a_manger
  - wait_for_trigger:
    - entity_id: binary_sensor.presence_sensor_fp2_d3fe_presence_sensor_3
      to: "off"
      for:
        seconds: 600
      trigger: state
    timeout:
      hours: 1
    continue_on_timeout: false
  - action: light.turn_off
    target:
      area_id: salle_a_manger
  
