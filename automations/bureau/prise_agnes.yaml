- id: 'auto_bureau_prise_agnes_monitoring'
  alias: "Bureau - Prise Agnès - Surveillance consommation"
  description: |
    Surveille en continu la consommation de la prise du bureau d'Agnès.
    - Si consommation < 4W pendant 15min : extinction automatique
    - Si consommation entre 4-80W pendant 60min : demande confirmation
    - Si consommation > 80W pendant 5min : réinitialise le drapeau de refus
    - Si Agnès quitte la maison : demande si elle veut maintenir la prise allumée
    Mode restart pour gérer les changements d'état pendant les attentes.
  mode: restart
  trigger:
    - id: auto_off_low
      platform: numeric_state
      entity_id: sensor.prise_bureau_agnes_puissance
      below: 4
      for: "00:15:00"
    - id: confirm_medium
      platform: numeric_state
      entity_id: sensor.prise_bureau_agnes_puissance
      above: 4
      below: 80
      for: "01:00:00"
    - id: clear_refusal_high
      platform: numeric_state
      entity_id: sensor.prise_bureau_agnes_puissance
      above: 80
      for: "00:05:00"
    - id: agnes_leaves
      platform: zone
      entity_id: person.agnes
      zone: zone.home
      event: leave
  condition:
    - condition: state
      entity_id: switch.prise_bureau_agnes_commutateur
      state: 'on'
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: auto_off_low
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.prise_bureau_agnes_commutateur
            - service: notify.mobile_app_iphone_de_agnes
              data:
                title: "Prise bureau éteinte"
                message: "Consommation faible détectée pendant 15 minutes. La prise a été éteinte automatiquement."

        - conditions:
            - condition: trigger
              id: confirm_medium
            - condition: state
              entity_id: input_boolean.prise_bureau_agnes_confirm_refused
              state: 'off'
          sequence:
            - variables:
                action_yes: "{{ 'AGNES_CONFIRM_YES_' ~ context.id }}"
                action_no: "{{ 'AGNES_CONFIRM_NO_' ~ context.id }}"
            - service: notify.mobile_app_iphone_de_agnes
              data:
                title: "Extinction de la prise bureau ?"
                message: "Consommation modérée (4-80W) depuis 60 minutes. Voulez-vous éteindre la prise ?"
                data:
                  actions:
                    - action: "{{ action_yes }}"
                      title: "Oui, éteindre"
                    - action: "{{ action_no }}"
                      title: "Non, garder allumée"
                  tag: "plug_agnes_confirm_{{ context.id }}"
            - wait_for_trigger:
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ action_yes }}"
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ action_no }}"
              timeout: "00:10:00"
              continue_on_timeout: true
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is defined and wait.trigger.event.data.action == action_yes }}"
                  sequence:
                    - service: switch.turn_off
                      target:
                        entity_id: switch.prise_bureau_agnes_commutateur
                    - service: notify.mobile_app_iphone_de_agnes
                      data:
                        title: "Prise éteinte"
                        message: "La prise du bureau a été éteinte suite à votre confirmation."
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is not defined }}"
                  sequence:
                    - service: switch.turn_off
                      target:
                        entity_id: switch.prise_bureau_agnes_commutateur
                    - service: notify.mobile_app_iphone_de_agnes
                      data:
                        title: "Prise éteinte"
                        message: "Délai de réponse dépassé. La prise a été éteinte automatiquement."
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is defined and wait.trigger.event.data.action == action_no }}"
                  sequence:
                    - service: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.prise_bureau_agnes_confirm_refused
                    - service: notify.mobile_app_iphone_de_agnes
                      data:
                        title: "Prise conservée"
                        message: "La prise du bureau reste allumée. Demande d'extinction désactivée jusqu'au prochain cycle."

        - conditions:
            - condition: trigger
              id: clear_refusal_high
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.prise_bureau_agnes_confirm_refused

        - conditions:
            - condition: trigger
              id: agnes_leaves
          sequence:
            - variables:
                action_yes: "{{ 'AGNES_KEEP_ON_YES_' ~ context.id }}"
                action_no: "{{ 'AGNES_KEEP_ON_NO_' ~ context.id }}"
            - service: notify.mobile_app_iphone_de_agnes
              data:
                title: "Prise bureau"
                message: "Vous quittez la maison. Voulez-vous maintenir la prise du bureau allumée ?"
                data:
                  actions:
                    - action: "{{ action_yes }}"
                      title: "Oui, maintenir"
                    - action: "{{ action_no }}"
                      title: "Non, éteindre"
                  tag: "plug_agnes_leave_{{ context.id }}"
            - wait_for_trigger:
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ action_yes }}"
                - platform: event
                  event_type: mobile_app_notification_action
                  event_data:
                    action: "{{ action_no }}"
              timeout: "00:10:00"
              continue_on_timeout: true
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is defined and wait.trigger.event.data.action == action_no }}"
                  sequence:
                    - service: switch.turn_off
                      target:
                        entity_id: switch.prise_bureau_agnes_commutateur
                    - service: notify.mobile_app_iphone_de_agnes
                      data:
                        title: "Prise éteinte"
                        message: "La prise du bureau a été éteinte."
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is not defined }}"
                  sequence:
                    - service: switch.turn_off
                      target:
                        entity_id: switch.prise_bureau_agnes_commutateur
                    - service: notify.mobile_app_iphone_de_agnes
                      data:
                        title: "Prise éteinte"
                        message: "Délai de réponse dépassé. La prise a été éteinte."
                - conditions:
                    - condition: template
                      value_template: "{{ wait.trigger is defined and wait.trigger.event.data.action == action_yes }}"
                  sequence:
                    - service: notify.mobile_app_iphone_de_agnes
                      data:
                        title: "Prise maintenue"
                        message: "La prise du bureau reste allumée."

- id: 'auto_bureau_prise_agnes_reset_refusal'
  alias: "Bureau - Prise Agnès - Réinitialisation refus"
  description: |
    Réinitialise le drapeau de refus de confirmation lorsque la prise est rallumée.
    Permet de réactiver les demandes de confirmation pour le cycle suivant.
  mode: restart
  trigger:
    - platform: state
      entity_id: switch.prise_bureau_agnes_commutateur
      from: 'off'
      to: 'on'
  condition: []
  action:
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.prise_bureau_agnes_confirm_refused
