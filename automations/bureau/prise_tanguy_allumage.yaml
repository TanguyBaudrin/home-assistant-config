- id: 'auto_bureau_prise_tanguy_allumage_matinal'
  alias: "Bureau - Prise Tanguy - Allumage matinal"
  description: |
    Allume la prise du bureau de Tanguy le matin à 08:15
    uniquement les jours où il travaille et qu'il est à la maison.
    Le booléen template tanguy_travaille_a_la_maison vérifie le calendrier,
    la localisation et l'heure (>= 8h).
  mode: single
  trigger:
    - platform: time
      at: "08:15:00"
  condition:
    - condition: and
      conditions:
        - condition: state
          entity_id: binary_sensor.tanguy_travaille_a_la_maison
          state: 'on'
        - condition: state
          entity_id: switch.prise_bureau_tanguy_commutateur
          state: 'off'
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.prise_bureau_tanguy_commutateur
