- id: 'auto_tech_alarme_gestion_modes_arlo'
  alias: Tech - Alarme - Modes Arlo selon présence
  description: |
    Cette automatisation ajuste le mode du système Arlo (présent, nuit ou absent) en fonction
    de la présence globale des occupants et de la période jour/nuit. Déclencheurs : coucher du
    soleil, 22h, et changements d'état des personnes. Actions : arme en mode "home" quand au
    moins une personne est là et c'est le jour, en mode "night" quand au moins une personne
    est là et c'est la nuit, et en mode "away" quand tout le monde est parti. (Modifié le
    2026-09-30)
  trigger:
    - platform: sun
      event: sunset
      id: soleil_se_couche
    - platform: time
      at: '22:00:00'
      id: heure_de_coucher
    - platform: state
      entity_id: person.agnes
      id: agnes_state
    - platform: state
      entity_id: person.tanguy_baudrin
      id: tanguy_state
  condition: []
  action:
    - choose:
        - alias: Mode "absent" quand tout le monde est parti
          conditions:
            - condition: state
              entity_id: person.agnes
              state: not_home
            - condition: state
              entity_id: person.tanguy_baudrin
              state: not_home
          sequence:
            - service: alarm_control_panel.alarm_arm_away
              target:
                device_id: c83b0003189dab2a3fa137b4e527d448
        - alias: Mode "présent" le jour si au moins une personne est là
          conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: person.agnes
                  state: home
                - condition: state
                  entity_id: person.tanguy_baudrin
                  state: home
            - condition: state
              entity_id: binary_sensor.mode_jour
              state: "on"
          sequence:
            - service: alarm_control_panel.alarm_arm_home
              target:
                device_id: c83b0003189dab2a3fa137b4e527d448
        - alias: Mode "nuit" le soir si au moins une personne est là
          conditions:
            - condition: or
              conditions:
                - condition: state
                  entity_id: person.agnes
                  state: home
                - condition: state
                  entity_id: person.tanguy_baudrin
                  state: home
            - condition: state
              entity_id: binary_sensor.mode_jour
              state: "off"
          sequence:
            - service: alarm_control_panel.alarm_arm_night
              target:
                device_id: c83b0003189dab2a3fa137b4e527d448
      default:
        - service: alarm_control_panel.alarm_arm_away
          target:
            device_id: c83b0003189dab2a3fa137b4e527d448
  mode: single
