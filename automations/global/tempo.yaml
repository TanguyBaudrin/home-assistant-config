- id: 'tempo_state_changed'
  alias: '[Maison] Changement condition RTE tempo'
  description: ''
  triggers:
  - type: turned_on
    device_id: 8e593b8e10f5eb1417a460f71c9d4cf3
    entity_id: c9b249b9333bf862966e0ad3b5f0b763
    domain: binary_sensor
    metadata:
      secondary: false
    trigger: device
    id: HC Activé
  - type: turned_off
    device_id: 8e593b8e10f5eb1417a460f71c9d4cf3
    entity_id: c9b249b9333bf862966e0ad3b5f0b763
    domain: binary_sensor
    trigger: device
    id: HC Désactivé
  conditions: []
  actions:
  - if:
    - condition: trigger
      id:
      - HC Activé
    then:
    - choose:
      - conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state: Bleu
        sequence:
        - action: select.select_option
          metadata: {}
          data:
            option: Bleu HC
          target:
            entity_id: select.consommation_rte_tempo
      - conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state: Blanc
        sequence:
        - action: select.select_option
          metadata: {}
          data:
            option: Blanc HC
          target:
            entity_id: select.consommation_rte_tempo
      - conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state: Rouge
        sequence:
        - action: select.select_option
          metadata: {}
          data:
            option: Rouge HC
          target:
            entity_id: select.consommation_rte_tempo
    else:
    - choose:
      - conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state: Bleu
        sequence:
        - action: select.select_option
          metadata: {}
          data:
            option: Bleu HP
          target:
            entity_id: select.consommation_rte_tempo
      - conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state: Blanc
        sequence:
        - action: select.select_option
          metadata: {}
          data:
            option: Blanc HP
          target:
            entity_id: select.consommation_rte_tempo
      - conditions:
        - condition: state
          entity_id: sensor.rte_tempo_couleur_actuelle
          state: Rouge
        sequence:
        - action: select.select_option
          metadata: {}
          data:
            option: Rouge HP
          target:
            entity_id: select.consommation_rte_tempo
  mode: single
- id: 'auto_global_tempo_notification_couleur_demain'
  alias: 'Tempo - Notification couleur du lendemain'
  description: >
    Envoie une notification push sur les téléphones d'Agnès et Tanguy lorsque la
    couleur Tempo du lendemain est connue (Bleu, Blanc ou Rouge). Déclencheurs :
    changement d'état de sensor.rte_tempo_prochaine_couleur vers Bleu, Blanc ou
    Rouge. Actions : notification sur les deux iPhones avec la couleur prévue.
    (Migré le 2026-10-15)
  trigger:
  - entity_id:
    - sensor.rte_tempo_prochaine_couleur
    to: Bleu
    id: bleu
    trigger: state
  - entity_id:
    - sensor.rte_tempo_prochaine_couleur
    to: Blanc
    id: blanc
    trigger: state
  - entity_id:
    - sensor.rte_tempo_prochaine_couleur
    to: Rouge
    id: rouge
    trigger: state
  condition: []
  action:
  - action: notify.mobile_app_iphone_pro_de_tanguy
    metadata: {}
    data:
      message: 'Jour tempo pour demain: {{ trigger.id }}'
      title: Jour tempo pour demain
  - action: notify.mobile_app_iphone_de_agnes
    metadata: {}
    data:
      message: 'Jour tempo pour demain: {{ trigger.id }}'
      title: Jour tempo pour demain
  mode: single
