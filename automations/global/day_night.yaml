- id: open_day_cover
  alias: Auto - Maison - Volets - Ouverture au réveil ou au lever du soleil
  description: |
    Ouvre les volets le matin à la heure qui intervient en dernier entre l'heure
    de réveil et le lever du soleil. Désactive les automatismes lumineux et
    éteint les lumières allumées. (Migré le 2026-09-30)
  triggers:
  - trigger: sun
    event: sunrise
    id: soleil
  - trigger: time
    at: input_datetime.heure_de_reveil_de_la_maison
    id: heure_reveil
  conditions: []
  actions:
  - choose:
    - alias: Soleil après l'heure de réveil
      conditions:
      - condition: trigger
        id: soleil
      - condition: template
        value_template: >-
          {{
            today_at(states('input_datetime.heure_de_reveil_de_la_maison'))
            <= now()
          }}
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.lumieres_desactivees_par_media
      - data: {}
        target:
          entity_id: input_boolean.lumieres_automatiques
        alias: Désactivation de l'éclairage automatique
        action: input_boolean.turn_off
      - data: {}
        target:
          area_id:
          - bureau
          - chambre_des_parents
          - cuisine
          - salle_a_manger
          - chambre_louis
          - chambre_maxime
        action: cover.open_cover
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          area_id:
          - salon
          - salle_a_manger
          - cuisine
    - alias: Réveil après le lever du soleil
      conditions:
      - condition: trigger
        id: heure_reveil
      - condition: sun
        after: sunrise
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.lumieres_desactivees_par_media
      - data: {}
        target:
          entity_id: input_boolean.lumieres_automatiques
        alias: Désactivation de l'éclairage automatique
        action: input_boolean.turn_off
      - data: {}
        target:
          area_id:
          - bureau
          - chambre_des_parents
          - cuisine
          - salle_a_manger
          - chambre_louis
          - chambre_maxime
        action: cover.open_cover
      - action: light.turn_off
        metadata: {}
        data: {}
        target:
          area_id:
          - salon
          - salle_a_manger
          - cuisine
  mode: single
- id: calculate_wakeup_jour
  alias: Auto - Maison - Heure réveil - Définition de l'heure de réveil de la maison
  description: ''
  triggers:
  - trigger: time
    at: '01:00:00'
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ state_attr("calendar.maison","message") == "Weekend"
            }}'
        - condition: state
          entity_id: calendar.maison
          state: 'on'
      sequence:
      - action: input_datetime.set_datetime
        metadata: {}
        data:
          time: 09:30:00
        target:
          entity_id: input_datetime.heure_de_reveil_de_la_maison
      alias: Le weekend
    - conditions:
      - condition: and
        conditions:
        - condition: state
          entity_id: calendar.agnes
          state: 'on'
        - condition: template
          value_template: '{{ "non travaillé".lower() in state_attr("calendar.agnes","message").lower()
            }}'
      sequence:
      - action: input_datetime.set_datetime
        metadata: {}
        data:
          time: 09:30:00
        target:
          entity_id: input_datetime.heure_de_reveil_de_la_maison
      alias: Agnès jour non travaillé
    - conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ "non travaillé".lower() in state_attr("calendar.tanguy","message").lower()
            }}'
        - condition: state
          entity_id: calendar.tanguy
          state: 'on'
      sequence:
      - action: input_datetime.set_datetime
        metadata: {}
        data:
          time: 09:30:00
        target:
          entity_id: input_datetime.heure_de_reveil_de_la_maison
      alias: Tanguy jour non travaillé
    default:
    - action: input_datetime.set_datetime
      metadata: {}
      data:
        time: 07:00:00
      target:
        entity_id: input_datetime.heure_de_reveil_de_la_maison
  mode: single
