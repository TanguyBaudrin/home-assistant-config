- id: '1699818128381'
  alias: "Global - Routine - Activer « nuit » : lumières auto, volets, alarme"
  description: |
    Active, à la tombée de la nuit ou à 22h, les automatismes de lumières, ferme tous les volets de la maison et passe l’alarme en mode nuit pour préparer la maison au coucher. Déclencheurs : coucher du soleil ou 22h. Actions : active input_boolean.lumieres_automatiques, ferme les volets des chambres et pièces communes, arme Arlo en mode nuit. (Migré le 2026-01-25)
  trigger:
    - platform: sun
      event: sunset
      offset: '00:00:00'
    - platform: time
      at: '22:00:00'
  condition: []
  action:
    - alias: Activer l'automatisation des lumières
      service: input_boolean.turn_on
      target:
        entity_id: input_boolean.lumieres_automatiques
    - alias: Fermer tous les volets
      service: cover.close_cover
      target:
        area_id:
          - chambre_des_parents
          - cuisine
          - salle_a_manger
          - chambre_louis
          - chambre_maxime
    - alias: Passer Arlo en mode "nuit"
      service: alarm_control_panel.alarm_arm_night
      target:
        entity_id: alarm_control_panel.aarlo_location_home
  mode: single

- id: '1699870051044'
  alias: "Global - Chauffage - Automatisation du planning matinal selon calendrier du jour (Télétravail, Vacances, Quotidien)"
  description: |
    Cette automatisation pilote chaque matin à 5h le choix du planning de chauffage Netatmo pour toute la maison en fonction des événements du calendrier : 
    - Si un événement "Télétravail" est en cours, applique le planning Télétravail aux pièces concernés.
    - Si un événement "Congés" est en cours, applique le planning Vacances.
    - Sinon, applique le planning Quotidien.
    Zones : bureau, chambre Louis, chambre Maxime, chambre des parents, entrée, salle à manger. 
    Déclencheur : 5h00. 
    Actions : Sélection dynamique du planning de chauffage selon la présence des événements Télétravail ou Congés. 
    (Migré le 25/01/2026)
  trigger:
    - platform: time
      at: '05:00:00'
  condition: []
  action:
    - choose:
        - conditions:
            - alias: Un événement Télétravail est en cours
              condition: and
              conditions:
                - condition: state
                  entity_id: calendar.maison
                  state: 'on'
                  alias: Un événement est en cours
                - condition: state
                  entity_id: calendar.maison
                  attribute: message
                  state: Télétravail
                  alias: Le rendez-vous est de type Télétravail
          sequence:
            - service: netatmo.set_schedule
              data:
                schedule_name: Télétravail
              target:
                area_id:
                  - bureau
                  - chambre_louis
                  - chambre_maxime
                  - chambre_parents
                  - entree
                  - salle_a_manger
        - conditions:
            - alias: Un événement Congés est en cours
              condition: and
              conditions:
                - condition: state
                  entity_id: calendar.maison
                  state: 'on'
                  alias: Un événement est en cours
                - condition: state
                  entity_id: calendar.maison
                  attribute: message
                  state: Congés
                  alias: Le rendez-vous est de type Congés
          sequence:
            - service: netatmo.set_schedule
              data:
                schedule_name: Vacances
              target:
                area_id:
                  - bureau
                  - chambre_louis
                  - chambre_maxime
                  - chambre_parents
                  - entree
                  - salle_a_manger
      default:
        - service: netatmo.set_schedule
          data:
            schedule_name: Quotidien
          target:
            area_id:
              - bureau
              - chambre_louis
              - chambre_maxime
              - chambre_parents
              - entree
              - salle_a_manger
  mode: single
