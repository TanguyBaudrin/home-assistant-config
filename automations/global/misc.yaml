# Dette connue : cette description tient sur une seule ligne de plus de
# 160 caracteres. Le retour a la ligne ajouterait des sauts de ligne dans
# le texte affiche par Home Assistant, donc la correction est differee.
# yamllint disable rule:line-length

- id: '1699818128381'
  alias: "Global - Routine - Activer « nuit » : lumières auto, volets"
  description: |
    Active, à la tombée de la nuit ou à 22h, les automatismes de lumières et ferme tous
    les volets de la maison pour préparer la maison au coucher. Déclencheurs : coucher du
    soleil ou 22h. Actions : active input_boolean.lumieres_automatiques, ferme les volets
    des chambres et pièces communes. (Migré le 2026-01-25, Modifié le 2026-09-30)
  trigger:
    - platform: sun
      event: sunset
      offset: '00:00:00'
    - platform: time
      at: '22:00:00'
  condition: []
  action:
    - alias: Activer l'automatisation des lumières
      service: input_boolean.turn_on
      target:
        entity_id: input_boolean.lumieres_automatiques
    - alias: Fermer tous les volets
      service: cover.close_cover
      target:
        area_id:
          - chambre_des_parents
          - cuisine
          - salle_a_manger
          - chambre_louis
          - chambre_maxime
  mode: single

- id: '1699870051044'
  alias: "Global - Chauffage - Automatisation du planning matinal selon calendrier du jour (Télétravail, Vacances, Quotidien)"
  description: |
    Cette automatisation pilote chaque matin à 5h le choix du planning de chauffage Netatmo pour toute la maison en fonction des événements du calendrier :
    - Si un événement "Télétravail" est en cours, applique le planning Télétravail aux pièces concernés.
    - Si un événement "Congés" est en cours, applique le planning Vacances.
    - Sinon, applique le planning Quotidien.
    Zones : bureau, chambre Louis, chambre Maxime, chambre des parents, entrée, salle à manger.
    Déclencheur : 5h00.
    Actions : Sélection dynamique du planning de chauffage selon la présence des événements Télétravail ou Congés.
    (Migré le 25/01/2026)
  trigger:
    - platform: time
      at: '05:00:00'
  condition: []
  action:
    - choose:
        - conditions:
            - alias: Un événement Télétravail est en cours
              condition: and
              conditions:
                - condition: state
                  entity_id: calendar.maison
                  state: 'on'
                  alias: Un événement est en cours
                - condition: state
                  entity_id: calendar.maison
                  attribute: message
                  state: Télétravail
                  alias: Le rendez-vous est de type Télétravail
          sequence:
            - service: netatmo.set_schedule
              data:
                schedule_name: Télétravail
              target:
                area_id:
                  - bureau
                  - chambre_louis
                  - chambre_maxime
                  - chambre_parents
                  - entree
                  - salle_a_manger
        - conditions:
            - alias: Un événement Congés est en cours
              condition: and
              conditions:
                - condition: state
                  entity_id: calendar.maison
                  state: 'on'
                  alias: Un événement est en cours
                - condition: state
                  entity_id: calendar.maison
                  attribute: message
                  state: Congés
                  alias: Le rendez-vous est de type Congés
          sequence:
            - service: netatmo.set_schedule
              data:
                schedule_name: Vacances
              target:
                area_id:
                  - bureau
                  - chambre_louis
                  - chambre_maxime
                  - chambre_parents
                  - entree
                  - salle_a_manger
      default:
        - service: netatmo.set_schedule
          data:
            schedule_name: Quotidien
          target:
            area_id:
              - bureau
              - chambre_louis
              - chambre_maxime
              - chambre_parents
              - entree
              - salle_a_manger
  mode: single

- id: 'auto_global_coucher_maison'
  alias: "Maison - Événement - Activation du coucher de la maison"
  description: |
    Émet l'événement coucher_maison au coucher du soleil ou à 22h00 pour déclencher
    la séquence de nuit de la maison. (Migré le 2026-10-15)
  trigger:
    - platform: sun
      event: sunset
      offset: '00:00:00'
      id: soleil
    - platform: time
      at: '22:00:00'
      id: heure
  condition: []
  action:
    - event: coucher_maison
      event_data:
        trigger: '{{ trigger.id }}'
  mode: single
