- id: '1699817277063'
  alias: Global - Lumières - Activation ou désactivation centralisée des automatismes d'éclairage
  description: |
    Permet d'activer ou de désactiver d'un seul geste tous les automatismes liés à l'éclairage de la maison via le bouton général "Lumières automatiques". Déclencheur : changement d'état de l'entité input_boolean.lumieres_automatiques. Actions : active tous les automations d'éclairage si sur "on", désactive sinon. (Migré le 2026-01-25)
  trigger:
    - id: bouton_lumieres_automatiques
      platform: state
      entity_id: input_boolean.lumieres_automatiques
  condition: []
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.lumieres_automatiques
              state: 'on'
          sequence:
            - service: automation.turn_on
              target:
                entity_id:
                  - automation.lumiere_de_la_cuisine_automatique
                  - automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
        - conditions:
            - condition: state
              entity_id: input_boolean.lumieres_automatiques
              state: 'off'
          sequence:
            - service: automation.turn_off
              target:
                entity_id:
                  - automation.lumiere_de_la_cuisine_automatique
                  - automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
  mode: single
