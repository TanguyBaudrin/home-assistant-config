# Dette connue : cette description tient sur une seule ligne de plus de
# 160 caracteres. Le retour a la ligne ajouterait des sauts de ligne dans
# le texte affiche par Home Assistant, donc la correction est differee.
# yamllint disable rule:line-length

- id: '1699817277063'
  alias: "Global - Lumières - Activation/désactivation centralisée des automatismes d'éclairage"
  description: |
    Active ou désactive tous les automatismes lumières de la maison via l’interrupteur principal. Déclencheur : changement d’état de input_boolean.lumieres_automatiques. Actions : active ou désactive les automatisations lumières selon la position du toggle. (Migré le 2026-01-25)
  trigger:
    - id: interrupteur_global_lumieres
      platform: state
      entity_id: input_boolean.lumieres_automatiques
  condition: []
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.lumieres_automatiques
              state: 'on'
          sequence:
            - service: automation.turn_on
              target:
                entity_id:
                  - automation.lumiere_de_la_cuisine_automatique
                  - automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
        - conditions:
            - condition: state
              entity_id: input_boolean.lumieres_automatiques
              state: 'off'
          sequence:
            - service: automation.turn_off
              target:
                entity_id:
                  - automation.lumiere_de_la_cuisine_automatique
                  - automation.salon_gestion_de_la_lumiere_avec_capteur_de_presence
  mode: single
