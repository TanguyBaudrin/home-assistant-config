- alias: Canicule - notification free cooling efficace
  id: canicule_free_cooling
  description: Prévenir uniquement si l'extérieur est au moins 1,5°C plus frais
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/10"

  condition:
    - condition: template
      value_template: >-
        {{ now() - state_attr("automation.canicule_notification_free_cooling_efficace", "last_triggered") > timedelta(0.5) }}
    - condition: state
      entity_id: binary_sensor.mode_jour
      state: "on"
    - condition: template
      value_template: >
        {{ states('sensor.temperature_moyenne_de_la_maison') | float(0) >= 24 }}
    - condition: template
      value_template: >
        {{ (states('sensor.temperature_moyenne_de_la_maison') | float(0) -
            states('sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure') | float(0)) >= 1.5 }}

  action:
    - service: notify.mobile_app_iphone_pro_de_tanguy
      data:
        title: "Ouvrez les fenêtres"
        message: >
          Il fait {{ states('sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure') }}°C dehors
          contre {{ states('sensor.temperature_moyenne_de_la_maison') }}°C dans le salon.
          C'est le bon moment pour rafraîchir la maison.
    - service: notify.mobile_app_iphone_de_agnes
      data:
        title: "Ouvrez les fenêtres"
        message: >
          Il fait {{ states('sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure') }}°C dehors
          contre {{ states('sensor.temperature_moyenne_de_la_maison') }}°C dans le salon.
          C'est le bon moment pour rafraîchir la maison.

- alias: Canicule - fermer les fenêtres le matin
  id: canicule_close_windows
  description: Prévenir quand l'air extérieur devient plus chaud que l'intérieur
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/10"

  condition:
    - condition: template
    value_template: >-
      {{ now() - state_attr("automation.canicule_fermer_les_fenetres_le_matin", "last_triggered") > timedelta(0.5) }}
    - condition: state
      entity_id: binary_sensor.mode_jour
      state: "on"
    - condition: template
      value_template: >
        {{ (states('sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure') | float(0) -
            states('sensor.temperature_moyenne_de_la_maison') | float(0)) >= 1 }}
    - condition: state
      entity_id: binary_sensor.mode_canicule
      state: "on"

  action:
    - service: notify.mobile_app_iphone_pro_de_tanguy
      data:
        title: "Fermez les fenêtres"
        message: >
          L'air extérieur devient plus chaud que l'intérieur.
          Fermez les fenêtres et les volets pour conserver la fraîcheur.
    - service: notify.mobile_app_iphone_de_agnes
      data:
        title: "Fermez les fenêtres"
        message: >
          L'air extérieur devient plus chaud que l'intérieur.
          Fermez les fenêtres et les volets pour conserver la fraîcheur.

- alias: Canicule - fermer volets
  id: canicule_close_cover
  description: Fermer les volets en période de chaleur
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/10"
  conditions:
    - condition: state
      entity_id: binary_sensor.mode_jour
      state: "on"
  actions:
    - parallel:
      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 10
          - condition: template
            value_template: >
              {{ 60 <= state_attr('sun.sun', 'azimuth') | float(0) <= 170 }} 
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_est', 'current_position') | float(0) > 10}} 
          - service: cover.close_cover
            target:
              entity_id:
                - cover.cuisine
        alias: "Fermer les volets est"

      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 10
          - condition: template
            value_template: >
              {{ 60 <= state_attr('sun.sun', 'azimuth') | float(0) <= 130 }} 
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_est', 'current_position') | float(0) > 10}} 
          - service: cover.set_cover_position
            target:
              entity_id: cover.cover_est
            data:
              position: 10
        alias: "Fermer les velux est"

      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 10
          - condition: template
            value_template: >
              {{ 230 <= state_attr('sun.sun', 'azimuth') | float(0) <= 310 }} 
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_ouest', 'current_position') | float(0) > 10}}
          - service: cover.close_cover
            target:
              entity_id:
                - cover.salle_a_manger_grand
        alias: "Fermer les volets ouest"

      
      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 10
          - condition: template
            value_template: >
              {{ 160 <= state_attr('sun.sun', 'azimuth') | float(0) <= 310 }} 
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_ouest', 'current_position') | float(0) > 10}}
          - service: cover.set_cover_position
            target:
              entity_id: cover.cover_ouest
            data:
              position: 10
        alias: "Fermer les velux ouest"
        
      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: numeric_state
            entity_id: sun.sun
            attribute: elevation
            above: 20
          - condition: template
            value_template: >
              {{ 140 <= state_attr('sun.sun', 'azimuth') | float(0) <= 220 }} 
          - service: cover.close_cover
            target:
              entity_id:
                - cover.salle_a_manger_petit
        alias: "Fermer les volets sud"
      

- alias: Canicule - rouvrir volets après exposition
  id: canicule_open_cover
  description: Rouvrir les volets est quand le soleil ne tape plus dessus
  mode: single

  trigger:
    - platform: time_pattern
      minutes: "/15"
  conditions:
    - condition: state
      entity_id: binary_sensor.mode_jour
      state: "on"
  actions:
    - parallel:
      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: template
            value_template: >
              {{ state_attr('sun.sun', 'azimuth') | float(0) > 180 }}
          - condition: numeric_state
            entity_id: sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure
            below: 34
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_est', 'current_position') | float(0) < 50}}
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_est', 'current_position') | float(0) > 0}}
          - service: cover.open_cover
            target:
              entity_id:
                - cover.cuisine
          - delay:
              hours: 0
              minutes: 1
              seconds: 0
          - service: cover.set_cover_position
            target:
              entity_id:
                - cover.cover_est
            data:
              position: 60
        alias: "Rouvrir les volets est"
        
      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: template
            value_template: >
              {{ state_attr('sun.sun', 'azimuth') | float(0) > 320 }}
          - condition: numeric_state
            entity_id: sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure
            below: 34
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_ouest', 'current_position') | float(0) < 50}}
          - condition: template
            value_template: >
              {{ state_attr('cover.cover_ouest', 'current_position') | float(0) > 0}}
          - service: cover.open_cover
            target:
              entity_id:
                - cover.salle_a_manger_grand
          - delay:
              hours: 0
              minutes: 1
              seconds: 0
          - service: cover.set_cover_position
            target:
              entity_id:
                - cover.cover_ouest
            data:
              position: 60
        alias: "Rouvrir les volets ouest"
      
      - sequence:
          - condition: state
            entity_id: binary_sensor.mode_canicule
            state: "on"
          - condition: template
            value_template: >
              {{ state_attr('sun.sun', 'azimuth') | float(0) > 270 }}
          - condition: numeric_state
            entity_id: sensor.maison_meteo_france_forecast_for_city_wasquehal_nord_pas_de_calais_59_fr_temperature_exterieure
            below: 34
          - service: cover.open_cover
            target:
              entity_id:
                - cover.salle_a_manger_petit
        alias: "Rouvrir les volets est"
      