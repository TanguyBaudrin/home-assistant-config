- id: 'auto_global_depart_travail_tanguy'
  alias: 'Global - Notification - Tanguy quitte son lieu de travail'
  description: |
    Envoie une notification sur le téléphone d'Agnès lorsque Tanguy quitte
    son lieu de travail (SFEIR Lille), uniquement les jours de semaine
    après 13h. (Migré le 2026-10-04)
  trigger:
  - entity_id: person.tanguy_baudrin
    zone: zone.sfeir_lille
    event: leave
    id: sfeir
    trigger: zone
  condition:
  - alias: Les jours de semaine après 13h
    condition: time
    after: '13:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  action:
  - action: notify.mobile_app_iphone_de_agnes
    metadata: {}
    data:
      message: Tanguy vient de partir de {{ trigger.id }}
      title: Tanguy viens de partir
  mode: single
- id: 'auto_global_retour_domicile_notification'
  alias: Global - Notification - Retour à la maison avec notification de fin de cycle
  description: |
    Cette automatisation se déclenche lorsqu'Agnès ou Tanguy rentre à la maison.
    Elle remet le thermostat du séjour en mode « schedule » et envoie une
    notification personnalisée (selon la personne qui rentre) si la machine à
    laver ou le sèche-linge sont encore en cycle, puis désactive les indicateurs
    correspondants. (Migré le 2026-10-05)
  trigger:
  - alias: Quand Agnès passe présente
    entity_id:
    - person.agnes
    from: not_home
    to: home
    id: Agnes
    platform: state
  - alias: Quand Tanguy passe présent
    entity_id:
    - person.tanguy_baudrin
    from: not_home
    to: home
    id: Tanguy
    platform: state
  condition: []
  action:
  - data:
      preset_mode: schedule
    target:
      entity_id: climate.sejour
    action: climate.set_preset_mode
  - alias: Envoyer notifications de machine à laver/sèche linge terminé
    choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.machine_a_laver_a_sortir
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: trigger
            id:
            - Tanguy
          sequence:
          - action: notify.mobile_app_iphone_pro_de_tanguy
            metadata: {}
            data:
              message: La machine a laver est terminée
              title: Machine à laver
        - conditions:
          - condition: trigger
            id:
            - Agnes
          sequence:
          - action: notify.mobile_app_iphone_de_agnes
            metadata: {}
            data:
              message: La machine a laver est terminée
              title: Machine à laver
        - action: input_boolean.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: input_boolean.machine_a_laver_a_sortir
    - conditions:
      - condition: state
        entity_id: input_boolean.seche_linge_a_sortir
        state: 'on'
      sequence:
      - choose:
        - conditions:
          - condition: trigger
            id:
            - Tanguy
          sequence:
          - action: notify.mobile_app_iphone_pro_de_tanguy
            metadata: {}
            data:
              message: La sèche linge est terminé
              title: Sèche linge
        - conditions:
          - condition: trigger
            id:
            - Agnes
          sequence:
          - action: notify.mobile_app_iphone_de_agnes
            metadata: {}
            data:
              message: La sèche linge est terminé
              title: Sèche linge
        - action: input_boolean.turn_off
          metadata: {}
          data: {}
          target:
            entity_id: input_boolean.seche_linge_a_sortir
- id: 'auto_global_cameras_batterie_faible'
  alias: 'Global - Caméras - Alerte batterie faible des caméras'
  description: |
    Envoie une notification lorsque la batterie d'une des caméras (abri de jardin, terrasse,
    garage côté jardin) descend en dessous de 10%. Déclencheurs : seuil de batterie faible
    sur les trois capteurs de caméra. Actions : notification push vers l'iPhone de Tanguy
    avec le nom de la caméra concernée. (Migré le 2026-10-03)
  trigger:
  - type: battery_level
    device_id: 69b55e596098bf4d9ff6926fde3b37e2
    entity_id: 48dc69f0808fe6a975e418f4cb0a96e5
    domain: sensor
    below: 10
    id: abri de jardin
    trigger: device
  - type: battery_level
    device_id: 4af4fafa7852933d37f18426446a3e82
    entity_id: 4e06bfd72bfd4a955e12d1f118ff6c07
    domain: sensor
    id: terrasse
    below: 10
    trigger: device
  - type: battery_level
    device_id: a7af7b4e2aef8ea17ec6e6e317e856d2
    entity_id: dea0cb06fff8c475ba7cc05fb4af3da2
    domain: sensor
    id: garage côté jardin
    below: 10
    trigger: device
  condition: []
  action:
  - service: notify.mobile_app_iphone_pro_de_tanguy
    data:
      title: Batterie faible
      message: La caméra {{ trigger.id }} a moins de 10% de batterie
  mode: single
