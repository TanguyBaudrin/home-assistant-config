- id: 'auto_energy_tempo_garage_sequence'
  alias: "Energy - Tempo Garage - Gestion allumage/extinction appareils heures creuses"
  description: >
    Gère l'allumage et l'extinction séquentielle des appareils (VMC grenier,
    prises du bureau, serveurs et périphériques du garage) en fonction des
    périodes heures creuses et heures pleines du tarif Tempo EDF. En heures
    creuses (jours bleus, blancs ou rouges), les appareils sont rallumés ; en
    heures pleines jours rouges, les serveurs et la VMC sont coupés.
    (Migré le 2026-10-23)
  trigger:
    - id: heures_creuses
      trigger: state
      entity_id:
        - binary_sensor.rte_tempo_heures_creuses
      to: 'on'
      from: 'off'
    - id: heure_pleines
      trigger: state
      entity_id:
        - binary_sensor.rte_tempo_heures_creuses
      to: 'off'
      from: 'on'
  condition: []
  action:
    - delay:
        hours: 0
        minutes: 1
        seconds: 0
        milliseconds: 0
    - choose:
        - conditions:
            - alias: "Passage en HC bleues/blanches/rouges 🔕 ⚪️ 🔔"
              condition: and
              conditions:
                - condition: state
                  entity_id: sensor.rte_tempo_couleur_actuelle
                  state:
                    - Bleu
                    - Blanc
                    - Rouge
                - condition: trigger
                  id:
                    - heures_creuses
          sequence:
            - parallel:
                - sequence:
                    - action: automation.turn_on
                      metadata: {}
                      target:
                        entity_id:
                          - automation.grenier_automatisation_de_la_vmc
                          - automation.auto_grenier_vmc_reguler_la_vitesse_en_fonction_de_lhumidite
                      data: {}
                    - action: input_select.select_option
                      metadata: {}
                      target:
                        entity_id: input_select.interrupteur_vmc
                      data:
                        option: Vitesse 1
                  alias: Rallumer VMC
                - parallel:
                    - action: automation.turn_on
                      metadata: {}
                      target:
                        entity_id:
                          - automation.auto_bureau_prise_tanguy_gestion_de_l_allumage_extinction_en_automatique_de_la_prise
                          - automation.auto_bureau_prise_bureau_agnes_automatiser_l_allumage_extinction_de_la_prise
                      data: {}
                  alias: Automatisations prises du bureau
                - alias: Allumer les serveurs
                  sequence:
                    - action: switch.turn_on
                      metadata: {}
                      target:
                        entity_id: switch.multiprise_garage_serveurs
                      data: {}
                    - delay:
                        hours: 0
                        minutes: 1
                        seconds: 0
                        milliseconds: 0
                    - action: switch.turn_on
                      metadata: {}
                      target:
                        entity_id:
                          - switch.prise_routeur_cisco_poe
                      data: {}
                    - wait_template: >
                        {{ is_state("sensor.borne_du_bureau_state", "Connected")
                          }}
                      continue_on_timeout: false
                      timeout: '3600'
                    - action: switch.turn_on
                      metadata: {}
                      target:
                        entity_id: switch.prise_nas_asustor
                      data: {}
                    - wait_template: >
                        {{ is_state("binary_sensor.nas_asustor", "on") }}
                      continue_on_timeout: true
                    - action: switch.turn_on
                      metadata: {}
                      target:
                        entity_id: switch.prise_serveur_dell_commutateur
                      data: {}
                - action: switch.turn_on
                  metadata: {}
                  target:
                    label_id: auto_on_jour_rouge
                  data: {}
          alias: "Passage en HC bleues/blanches/rouges 🔕 ⚪️ 🔔"
        - conditions:
            - alias: "Passage en HP rouge 🔔"
              condition: and
              conditions:
                - condition: state
                  entity_id: sensor.rte_tempo_couleur_actuelle
                  state:
                    - Rouge
                - condition: trigger
                  id:
                    - heure_pleines
          sequence:
            - parallel:
                - action: switch.turn_off
                  metadata: {}
                  target:
                    label_id: off_jour_rouge
                  data: {}
                - alias: Eteindre les serveurs
                  sequence:
                    - action: button.press
                      metadata: {}
                      target:
                        entity_id: button.node_proxmox_pve_shutdown
                      data: {}
                    - wait_template: >
                        {{ is_state("sensor.prise_serveur_dell_courant", "0.0")}}
                      continue_on_timeout: false
                      timeout: '3600'
                    - action: shell_command.asustor_shutdown
                      metadata: {}
                      data: {}
                    - wait_template: >
                        {{ is_state("sensor.prise_nas_asustor_courant", "0.0")}}
                      continue_on_timeout: false
                      timeout: '3600'
                    - action: switch.turn_off
                      metadata: {}
                      target:
                        entity_id:
                          - switch.prise_serveur_dell_commutateur
                          - switch.prise_routeur_cisco_poe
                          - switch.prise_nas_asustor
                      data: {}
                - sequence:
                    - action: automation.turn_off
                      metadata: {}
                      target:
                        entity_id:
                          - automation.auto_grenier_vmc_reguler_la_vitesse_en_fonction_de_lhumidite
                          - automation.grenier_automatisation_de_la_vmc
                      data:
                        stop_actions: true
                    - action: input_select.select_option
                      metadata: {}
                      target:
                        entity_id: input_select.interrupteur_vmc
                      data:
                        option: 'Off'
                  alias: Couper la VMC
                - parallel:
                    - action: automation.turn_off
                      metadata: {}
                      target:
                        entity_id:
                          - automation.auto_bureau_prise_tanguy_gestion_de_l_allumage_extinction_en_automatique_de_la_prise
                          - automation.auto_bureau_prise_bureau_agnes_automatiser_l_allumage_extinction_de_la_prise
                      data:
                        stop_actions: true
                  alias: Automatisations prises du bureau
  mode: single
