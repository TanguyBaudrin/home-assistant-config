- id: 'notif_dryer_ended'
  alias: Notification - Garage - Sèche linge - Notification de fin de séchage
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.tz3000_2putqrmw_ts011f_puissance_2
    for:
      hours: 0
      minutes: 2
      seconds: 0
    above: 1000
    id: sache-linge-en-route
  - trigger: numeric_state
    entity_id:
    - sensor.tz3000_2putqrmw_ts011f_puissance_2
    below: 1
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: seche-linge-fini
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - sache-linge-en-route
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.seche_linge_en_cours
    - conditions:
      - condition: trigger
        id:
        - seche-linge-fini
      - condition: state
        entity_id: input_boolean.seche_linge_en_cours
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.seche_linge_en_cours
      - choose:
        - conditions:
          - condition: and
            conditions:
            - condition: zone
              entity_id: device_tracker.iphone_de_agnes_2
              zone: zone.home
            - condition: zone
              entity_id: person.tanguy_baudrin
              zone: zone.home
          sequence:
          - action: notify.mobile_app_iphone_de_agnes
            metadata: {}
            data:
              title: Sèche linge
              message: Le sèche linge est terminé
          - action: notify.mobile_app_iphone_pro_de_tanguy
            metadata: {}
            data:
              message: Le sèche linge est terminé
              title: Sèche linge
        - conditions:
          - condition: zone
            entity_id: person.tanguy_baudrin
            zone: zone.home
          sequence:
          - action: notify.mobile_app_iphone_pro_de_tanguy
            metadata: {}
            data:
              message: Le sèche linge est terminé
              title: Sèche linge
        - conditions:
          - condition: zone
            entity_id: person.agnes
            zone: zone.home
          sequence:
          - action: notify.mobile_app_iphone_de_agnes
            metadata: {}
            data:
              title: Sèche linge
              message: Le sèche linge est terminé
        default:
        - action: input_boolean.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: input_boolean.seche_linge_a_sortir
      - action: counter.increment
        metadata: {}
        target:
          entity_id: counter.nombre_de_cycles_de_sechages
        data: {}
      - parallel:
        - action: tts.speak
          metadata: {}
          target:
            entity_id: tts.google_translate_fr_fr
          data:
            cache: true
            media_player_entity_id: media_player.googlehome4148_2
            message: Le sèche-linge est terminé
        - action: tts.speak
          metadata: {}
          target:
            entity_id: tts.google_translate_fr_fr
          data:
            cache: true
            media_player_entity_id: media_player.enceinte_salle_de_bain_2
            message: Le sèche-linge est terminé
        - action: tts.speak
          metadata: {}
          target:
            entity_id: tts.google_translate_fr_fr
          data:
            cache: true
            media_player_entity_id: media_player.sejour_2
            message: Le sèche-linge est terminé
  mode: single
