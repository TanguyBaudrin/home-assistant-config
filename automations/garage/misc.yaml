- id: 'auto_garage_porte_commutateur'
  alias: Garage - Porte - Envoyer la commande au commutateur
  description: >-
    Cette automatisation envoie une commande au commutateur de la porte de garage
    lorsqu'on appuie sur le bouton virtuel `input_button.bouton_porte_de_garage`.
    Elle effectue deux toggles successifs pour simuler un appui sur le commutateur physique.
    (Migré le 2026-10-10)
  trigger:
  - trigger: state
    entity_id:
    - input_button.bouton_porte_de_garage
  condition: []
  action:
  - action: switch.toggle
    metadata: {}
    data: {}
    target:
      entity_id: switch.commutateur_porte_de_garage_commutateur
  - action: switch.toggle
    metadata: {}
    data: {}
    target:
      entity_id: switch.commutateur_porte_de_garage_commutateur
  mode: single
- id: 'auto_garage_imprimante_3d_extinction'
  alias: Garage - Imprimante 3D - Éteindre l'imprimante si non utilisée
  description: >-
    Cette automatisation éteint l'imprimante 3D Prusa Core One lorsque le statut
    passe à "finished" et reste dans cet état pendant 20 minutes, indiquant que
    l'impression est terminée et que l'imprimante n'est plus utilisée.
    (Migré le 2026-10-19)
  trigger:
  - trigger: state
    entity_id:
    - sensor.prusa_core_one
    to: finished
    for:
      hours: 0
      minutes: 20
      seconds: 0
  condition: []
  action:
  - type: turn_off
    device_id: cc3d71cce80dccae6687e99689cea0ee
    entity_id: ae47c95210cfd39253b20c3097e472a0
    domain: switch
  mode: single
- id: 'auto_garage_prise_pc_extinction'
  alias: Garage - Prise PC - Éteindre la prise quand le PC est inactif
  description: >-
    Cette automatisation coupe l'alimentation de la prise du PC gaming lorsque
    la puissance consommée reste inférieure à 1 watt pendant 15 minutes,
    indiquant que le PC est éteint ou inactif.
    (Migré le 2026-10-22)
  trigger:
  - trigger: numeric_state
    entity_id:
    - sensor.prise_pc_gaming_puissance
    for:
      hours: 0
      minutes: 15
      seconds: 0
    below: 1
  condition: []
  action:
  - action: switch.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: switch.prise_pc_gaming
  mode: single
