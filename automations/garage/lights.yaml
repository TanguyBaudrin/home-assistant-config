- id: '1699802530095'
  alias: Garage - Lumières - Allumage automatique sur détection de mouvement
  description: >-
    Cette automatisation allume automatiquement les lampes du garage dès qu’un mouvement est détecté par le capteur
    spécifique et les éteint après trois minutes sans détection, pour plus de sécurité et d’économies d’énergie.
  use_blueprint:
    path: homeassistant/motion_light.yaml
    input:
      motion_entity: binary_sensor.motion_sensor_motion_detection_2
      light_target:
        device_id:
        - 685cca589003fea87012385c34573ea8
        - 8855561d2919d86e2b6523cc86983ee2
      no_motion_wait: 180
- id: 'auto_garage_lumiere_synchro_interrupteur'
  alias: Garage - Lumières - Synchronisation de la lumière avec l'interrupteur mural
  description: >-
    Cette automatisation synchronise la lumière du garage avec l'interrupteur mural.
    Lorsqu'on actionne l'interrupteur mural (allumé ou éteint), la lumière du garage
    suit le même état. (Migré le 2026-10-14)
  trigger:
  - trigger: state
    entity_id:
    - light.interrupteur_mural_lumiere
    to: 'on'
    id: allumé
  - trigger: state
    entity_id:
    - light.interrupteur_mural_lumiere
    to: 'off'
    id: éteint
  condition: []
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - allumé
      sequence:
      - action: light.turn_on
        target:
          area_id: garage
    - conditions:
      - condition: trigger
        id:
        - éteint
      sequence:
      - action: light.turn_off
        target:
          area_id: garage
  mode: single
- id: 'auto_garage_lumiere_porte_ouverte'
  alias: Garage - Lumières - Allumage quand la porte s'ouvre
  description: >-
    Cette automatisation allume la lumière du garage dès que la porte de garage
    s'ouvre (le capteur binaire passe à on). (Migré le 2026-10-18)
  trigger:
  - trigger: state
    entity_id:
    - binary_sensor.porte_de_garage
    to: 'on'
  condition: []
  action:
  - action: light.turn_on
    target:
      area_id: garage
  mode: single
