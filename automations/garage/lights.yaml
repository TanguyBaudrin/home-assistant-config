- id: '1699802530095'
  alias: Garage - Lumières - Allumage automatique sur détection de mouvement
  description: >-
    Cette automatisation allume automatiquement les lampes du garage dès qu’un mouvement est détecté par le capteur
    spécifique et les éteint après trois minutes sans détection, pour plus de sécurité et d’économies d’énergie.
  use_blueprint:
    path: homeassistant/motion_light.yaml
    input:
      motion_entity: binary_sensor.motion_sensor_motion_detection_2
      light_target:
        device_id:
        - 685cca589003fea87012385c34573ea8
        - 8855561d2919d86e2b6523cc86983ee2
      no_motion_wait: 180
