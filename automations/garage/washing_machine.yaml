- id: 'notif_washing_machine_ended'
  alias: Notification - Garage - Machine à laver - Notification de fin de lavage
  description: ''
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.machine_a_laver_puissance
    for:
      hours: 0
      minutes: 2
      seconds: 0
    above: 1000
    id: machine-en-route
  - trigger: numeric_state
    entity_id:
    - sensor.machine_a_laver_puissance
    below: 1
    for:
      hours: 0
      minutes: 2
      seconds: 0
    id: machine-terminee
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - machine-en-route
      sequence:
      - action: input_boolean.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.machine_a_laver_en_cours
    - conditions:
      - condition: trigger
        id:
        - machine-terminee
      - condition: state
        entity_id: input_boolean.machine_a_laver_en_cours
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        metadata: {}
        data: {}
        target:
          entity_id: input_boolean.machine_a_laver_en_cours
      - choose:
        - conditions:
          - condition: and
            conditions:
            - condition: zone
              entity_id: device_tracker.iphone_de_agnes_2
              zone: zone.home
            - condition: zone
              entity_id: person.tanguy_baudrin
              zone: zone.home
          sequence:
          - action: notify.mobile_app_iphone_de_agnes
            metadata: {}
            data:
              title: Machine à laver
              message: 'La machine à laver est terminée '
          - action: notify.mobile_app_iphone_pro_de_tanguy
            metadata: {}
            data:
              message: 'La machine à laver est terminée '
              title: Machine à laver
        - conditions:
          - condition: zone
            entity_id: person.tanguy_baudrin
            zone: zone.home
          sequence:
          - action: notify.mobile_app_iphone_pro_de_tanguy
            metadata: {}
            data:
              message: 'La machine à laver est terminée '
              title: Machine à laver
        - conditions:
          - condition: zone
            entity_id: person.agnes
            zone: zone.home
          sequence:
          - action: notify.mobile_app_iphone_de_agnes
            metadata: {}
            data:
              title: Machine à laver
              message: 'La machine à laver est terminée '
        default:
        - action: input_boolean.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: input_boolean.machine_a_laver_a_sortir
      - condition: time
        after: 09:00:00
        before: '22:00:00'
      - parallel:
        - action: tts.speak
          metadata: {}
          target:
            entity_id: tts.google_translate_fr_fr
          data:
            cache: true
            media_player_entity_id: media_player.googlehome4148_2
            message: La machine à laver est terminée
        - action: tts.speak
          metadata: {}
          target:
            entity_id: tts.google_translate_fr_fr
          data:
            cache: true
            media_player_entity_id: media_player.enceinte_salle_de_bain_2
            message: La machine à laver est terminée
        - action: tts.speak
          metadata: {}
          target:
            entity_id: tts.google_translate_fr_fr
          data:
            cache: true
            media_player_entity_id: media_player.sejour
            message: La machine à laver est terminée
  mode: single
