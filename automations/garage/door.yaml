- id: 'auto_garage_porte_arrivee_tanguy'
  alias: Garage - Porte de garage - Arrivée de Tanguy à vélo ou à pied
  description: >-
    Lorsque Tanguy rentre à la maison à vélo ou à pied et que la porte de garage
    est fermée, cette automatisation envoie une notification, appuie sur le
    bouton d'ouverture de la porte de garage, allume les lumières du garage,
    attend deux minutes, puis vérifie si la porte s'est ouverte. Si ce n'est
    pas le cas, elle rappelle l'appui sur le bouton.
    (Migré le 2026-10-13)
  trigger:
  - platform: zone
    entity_id: person.tanguy_baudrin
    zone: zone.home
    event: enter
  condition:
  - condition: and
    conditions:
    - condition: state
      entity_id: binary_sensor.porte_de_garage
      state: 'off'
    - alias: Tanguy rentre à vélo ou à pied
      condition: or
      conditions:
      - condition: state
        entity_id: sensor.iphone_pro_de_tanguy_activity
        state: Cycling
      - condition: state
        entity_id: sensor.iphone_pro_de_tanguy_activity
        state: Walking
  action:
  - action: notify.mobile_app_iphone_pro_de_tanguy
    metadata: {}
    data:
      message: Tanguy rentre à vélo
      title: Vélo
  - action: input_button.press
    metadata: {}
    data: {}
    target:
      entity_id: input_button.bouton_porte_de_garage
  - action: light.turn_on
    metadata: {}
    data: {}
    target:
      area_id: garage
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - if:
    - condition: state
      entity_id: binary_sensor.porte_de_garage
      state: 'on'
    then: []
    else:
    - action: input_button.press
      metadata: {}
      data: {}
      target:
        entity_id: input_button.bouton_porte_de_garage
  mode: single
- id: 'auto_garage_porte_garage_notification_ouverture'
  alias: Garage - Porte de garage - Notification si la porte reste ouverte
  description: >-
    Cette automatisation envoie une notification lorsque la porte de garage reste
    ouverte pendant plus de 5 minutes, ou lorsque l'un des occupants quitte la
    maison alors que la porte est encore ouverte.
    (Migré le 2026-10-14)
  trigger:
  - trigger: state
    entity_id:
    - binary_sensor.porte_de_garage
    to: 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
    id: trop_ouvert
  - trigger: state
    entity_id:
    - person.agnes
    from: home
    to: not_home
    id: depart_agnes
  - trigger: state
    entity_id:
    - person.tanguy_baudrin
    from: home
    to: not_home
    id: depart_tanguy
  condition:
  - condition: state
    entity_id: binary_sensor.porte_de_garage
    state: 'on'
  action:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - trop_ouvert
      sequence:
      - action: notify.mobile_app_iphone_pro_de_tanguy
        metadata: {}
        data:
          title: Porte de garage
          message: Attention la porte de garage est ouverte depuis plus de 5 minutes
      - action: notify.mobile_app_iphone_de_agnes
        metadata: {}
        data:
          title: Porte de garage
          message: Attention la porte de garage est ouverte depuis plus de 5 minutes
    - conditions:
      - condition: trigger
        id:
        - depart_agnes
        - depart_tanguy
      sequence:
      - action: notify.mobile_app_iphone_pro_de_tanguy
        metadata: {}
        data:
          title: Porte de garage
          message: Attention, vous quittez la maison avec la porte de garage ouverte
      - action: notify.mobile_app_iphone_de_agnes
        metadata: {}
        data:
          title: Porte de garage
          message: Attention, vous quittez la maison avec la porte de garage ouverte
  mode: single
