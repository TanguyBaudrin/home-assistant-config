# File de migration des automatisations.
#
# Les entrees correspondent, une par une, aux automatisations de
# `automations/to_split.yaml`, heritees de l'interface Lovelace et non
# encore migratees. Ce fichier est genere, pas edite a la main.
#
    # Pour verifier que la file est complete, le compte doit renvoyer 34 :
    #
    #     python3 -c "import yaml,sys; print(len(yaml.safe_load(open('automations/to_split.yaml'))))"
    #
# Le workflow nocturne factory-migrate.yml reclame UNE entree `pending` par
# nuit, la migre, ouvre une pull request, et passe l'entree a `done` dans
# cette pull request. Un humain fusionne : rien n'est fusionne
# automatiquement.
#
# Regles de migration : .agents/skills/home-assistant-migration/SKILL.md
# et AGENTS.md. Le procede doit rester iteratif et verifiable, jamais un
# reformatage massif du fichier.
#
# `attempts` compte les tentatives. Au-dela de `max_attempts`, l'entree passe
# a `blocked` et la factory s'arrete : une tache qui echoue trois fois est
# probablement trop atypique pour un agent, et meritait une intervention
# humaine.
