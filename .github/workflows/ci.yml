# Lint YAML rapide sur chaque push et pull request.
#
# Cette validation ne demarre aucun conteneur et ne contacte aucune API : c'est
# le seul travail qui tourne sur un runner heberge par GitHub. La validation
# Home Assistant reelle est dans ha-check.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer yamllint
        run: python -m pip install --disable-pip-version-check "yamllint==1.38.0"

      # Meme configuration et meme mode que `mise run validate` et que le hook
      # pre-commit : les exclusions des blueprints tiers vivent dans .yamllint.
      - name: Valider le YAML
        run: yamllint --strict .

      - name: Verifier que le JSON est valide
        # opencode.json et les fichiers devcontainer sont lus par des outils qui
        # n'echouent pas proprement sur un JSON malforme.
        run: |
          for f in opencode.json .devcontainer/devcontainer.json; do
            if [ -f "$f" ]; then
              echo "::group::$f"
              python -m json.tool "$f" > /dev/null
              echo "::endgroup::"
            fi
          done

  factory-tests:
    # Les workflows de l'usine sont du code eux aussi : ils continaient du
    # shell inline non teste (rendu de prompt, quoting awk) qui a casse en
    # production sur une vraie issue. Ces tests extraient le code reel des
    # workflows plutot que de recopier une version divergente.
    name: Tests usine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyYAML
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      # Ces scripts sortent en 1 des qu une assertion echoue et affichent le
      # detail de chaque assertion, plus lisible dans les logs que `node --test`.
      - name: Tests de selection de migration
        run: node .github/scripts/queue.test.cjs

      - name: Tests de pagination
        run: node .github/scripts/gh-pages.test.cjs

      - name: Tests de rendu de prompt
        run: bash .github/scripts/render-prompt.test.sh

      - name: Syntaxe shell des blocs run
        # `bash -n` ne execute rien mais verifie le quoting. C est ce controle
        # qui aurait attrape un apostrophe glissee dans un programme awk entre
        # apostrophes simples : le workflow echouait alors en syntaxe awk au
        # lieu d echouer au premier run reel.
        run: python3 .github/scripts/shell-syntax.py
