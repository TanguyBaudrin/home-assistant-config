# Transformation d'une issue en pull request.
#
# Declenche par l'etiquette `to-implement`, c'est-a-dire apres validation du
# plan redige par factory-spec.yml. C'est le deuxieme verrou humain du cycle :
# le premier est la relecture du plan, celui-ci l'autorisation d'ecrire.
#
# Controle de securite principal : sur un depot public, n'importe qui peut
# ouvrir une issue, et ce job s'execute sur un runner auto-heberge qui herite
# HASS_TOKEN. Le declencheur est donc volontairement une ETIQUETTE, qu'un
# mainteneur peut poser : une issue non relue n'est jamais traitee par l'agent.
# Le corps de l'issue est de surcroit traite comme une donnee, pas comme un
# ordre (voir .opencode/agents/factory-build.md).
name: Factory Build

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Numero de l'issue a traiter"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: factory-build-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

env:
  # CLI epinglee : sans --version le script d\'installation telecharge la
  # derniere version, qui peut casser la frontmatter d\'un agent.
  OPENCODE_VERSION: "1.18.33"
  TRIGGER_LABEL: to-implement
  BRANCH_PREFIX: factory/build/

jobs:
  build:
    name: Construction
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'to-implement'
    runs-on: [self-hosted, ha-factory]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reclamer l'issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = Number('${{ github.event.issue.number || inputs.issue_number }}');
            if (!Number.isFinite(number) || number < 1) {
              await core.setFailed('Numero d\'issue invalide.');
              return;
            }
            const issue = (await github.rest.issues.get({
              ...context.repo, issue_number: number,
            })).data;
            if (issue.state !== 'open') {
              core.info('Issue fermee : rien a faire.');
              core.setOutput('skip', 'true'); return;
            }
            if ((issue.pull_request ?? null) !== null) {
              await core.setFailed('Ce numero designe une pull request, pas une issue.');
              return;
            }
            // Garde-fou : une issue deja traitee ne doit pas etre rejouee.
            const { fetchAll } = require('./.github/scripts/gh-pages.cjs');
            const open = await fetchAll(github.rest.pulls.list,
                                        { ...context.repo, state: 'open' });
            const ref = `issue-${number}`;
            if (open.some(p => p.head.ref.endsWith(ref) || (p.body ?? '').includes(`<!-- issue ${number} -->`))) {
              core.info('Une pull request ouverte traite deja cette issue.');
              core.setOutput('skip', 'true'); return;
            }
            const title = issue.title || 'sans titre';
            const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '').slice(0, 40) || 'issue';
            core.info(`Issue ${number} : ${title}`);
            core.setOutput('skip', 'false');
            core.setOutput('number', String(number));
            core.setOutput('title', title);
            core.setOutput('body', issue.body ?? '');
            core.setOutput('branch', `${process.env.BRANCH_PREFIX}${ref}-${slug}`);

      - name: Preparer le prompt
        if: steps.issue.outputs.skip != 'true'
        id: prompt
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          set -euo pipefail
          # Les valeurs passent par des fichiers et un rendu awk, jamais par
          # une substitution sed : un corps d'issue est multiligne et peut
          # contenir |, &, \ ou des $, tous interpretes par sed. La premiere
          # version du workflow echouait exactement la-dessus, sur une vraie
          # issue ("unterminated `s' command").
          mkdir -p "$RUNNER_TEMP/prompt-vars"
          printf '%s' "$ISSUE_NUMBER" > "$RUNNER_TEMP/prompt-vars/ISSUE_NUMBER"
          printf '%s' "$ISSUE_TITLE"  > "$RUNNER_TEMP/prompt-vars/ISSUE_TITLE"
          printf '%s' "$ISSUE_BODY"   > "$RUNNER_TEMP/prompt-vars/ISSUE_BODY"

          awk -v dir="$RUNNER_TEMP/prompt-vars" '
            {
              # ATTENTION : ce programme est entre apostrophes simples, donc il
              # ne doit contenir AUCUN apostrophe, pas meme en commentaire.
              # Le balayage avance dans `rest` et jamais dans `out` : si une
              # valeur inseree contient elle-meme un placeholder, on ne le
              # rescane pas, sinon la boucle est infinie.
              out = ""
              rest = $0
              while (match(rest, /\{\{[A-Z_][A-Z0-9_]*\}\}/)) {
                out = out substr(rest, 1, RSTART - 1)
                key = substr(rest, RSTART + 2, RLENGTH - 4)
                f = dir "/" key
                if ((getline v < f) > 0) {
                  val = v
                  while ((getline v < f) > 0) val = val "\n" v
                  close(f)
                  out = out val
                } else {
                  # Fichier absent : on laisse le placeholder visible pour que
                  # le garde-fou plus bas echoue. Un fichier vide en revanche
                  # est legitime (corps d issue vide) et donne bien val vide.
                  out = out substr(rest, RSTART, RLENGTH)
                }
                rest = substr(rest, RSTART + RLENGTH)
              }
              print out rest
            }
          ' .github/prompts/build.md > "$RUNNER_TEMP/prompt-rendered.md"

          if grep -q '{{[A-Z_]' "$RUNNER_TEMP/prompt-rendered.md"; then
            echo "::error::placeholder non resolu dans le prompt rendu"
            grep -n '{{[A-Z_]' "$RUNNER_TEMP/prompt-rendered.md"
            exit 1
          fi
          # Delimiteur aleatoire : le prompt contient du texte d issue, donc un
          # delimiteur fixe pourrait etre cite par l auteur, tronquer la sortie
          # GITHUB_OUTPUT, voire y injecter des cles.
          delim="FACTORY_PROMPT_$(openssl rand -hex 16)"
          if grep -qxF "$delim" "$RUNNER_TEMP/prompt-rendered.md"; then
            echo "::error::collision improbable de delimiteur GITHUB_OUTPUT"
            exit 1
          fi
          {
            echo "body<<$delim"
            cat "$RUNNER_TEMP/prompt-rendered.md"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Installer opencode
        if: steps.issue.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/.opencode/bin
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          ~/.opencode/bin/opencode --version

      - name: Installer les validateurs
        # L etape de validation appelle yamllint par son nom, et le runner n en
        # a pas : sans cela, exec.getExecOutput leve une erreur peu parlante
        # ("Unable to locate executable file").
        #
        # On n installe rien depuis le reseau avec un script telecharge a l aveu
        # (genre get-pip.py) : ce job porte HASS_TOKEN. Si le runner n a ni
        # yamllint ni pip, c est une dependance systeme a poser, pas un
        # contournement a automatiser ici.
        run: |
          set -euo pipefail
          export PYTHONPATH="${PYTHONPATH:-}"
          if command -v yamllint >/dev/null 2>&1; then
            echo "yamllint deja present : $(yamllint --version)"
          elif python3 -m pip --version >/dev/null 2>&1; then
            # venv impossible ici (pas de ensurepip sur le runner) et --user se
            # heurte a PEP 668 : --target evite les deux et n ecrit rien dans
            # l environnement systeme du runner.
            TARGET="$RUNNER_TEMP/pytools"
            # --break-system-packages n existe qu a partir de pip 23. Sur un pip
            # plus ancien, le second essai echoue avec un usage illisible : on
            # garde donc la premiere erreur, qui elle est parlante.
            if ! first_error=$(python3 -m pip install --disable-pip-version-check \
                                 --target "$TARGET" "yamllint==1.38.0" 2>&1); then
              if ! python3 -m pip install --disable-pip-version-check \
                    --break-system-packages --target "$TARGET" "yamllint==1.38.0"; then
                echo "$first_error"
                echo "::error::installation de yamllint impossible avec ce pip"
                exit 1
              fi
            fi
            # PYTHONPATH n est pas cosmetique : le script `yamllint` cree par
            # --target fait `from yamllint.cli import run` et ne trouve pas les
            # paquets installes a cote de lui sans ca.
            export PYTHONPATH="$TARGET"
            # Les deux exports servent aussi dans CETTE etape : GITHUB_PATH et
            # GITHUB_ENV ne valent que pour les etapes suivantes, or le script
            # se verifie juste apres. Sans cet export, `command -v yamllint`
            # echoue silencieusement a la premiere installation.
            export PATH="$TARGET/bin:$PATH"
            echo "PYTHONPATH=$TARGET" >> "$GITHUB_ENV"
            echo "$TARGET/bin" >> "$GITHUB_PATH"
          else
            echo "::error::yamllint absent du runner, et pip aussi : rien a installer automatiquement."
            echo "::error::Sur le runner, au choix :"
            echo "::error::  - apt install python3-pip  (puis relancer ce workflow)"
            echo "::error::  - apt install yamllint      (meme version que ci.yml : 1.38.0)"
            exit 1
          fi
          command -v yamllint
          yamllint --version
          echo "validateur pret"

      - name: Verifier la configuration OmniRoute
        if: steps.issue.outputs.skip != 'true'
        # opencode.json resolait {env:OMNIROUTER_BASE_URL} : si la variable
        # manque, baseURL vaut chaine vide et l agent echoue sur une erreur
        # incomprehensible, `/chat/completions cannot be parsed as a URL`.
        # On verifie ici pour nommer la variable a l origem du probleme.
        run: |
          set -euo pipefail
          missing=()
          for var in OMNIROUTER_BASE_URL OMNIROUTER_API_KEY; do
            if [ -z "${!var:-}" ]; then missing+=("$var"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Variable(s) absente(s) sur le runner : ${missing[*]}"
            echo "::error::Elles doivent venir de /etc/ha-factory/runner.env, puis le service runner doit etre recharge."
            exit 1
          fi
          echo "OmniRoute configuree sur ${OMNIROUTER_BASE_URL}"

      # Les variables OmniRoute viennent de l'environnement du runner
      # (/etc/ha-factory/runner.env), pas des secrets GitHub.
      - name: Construire avec l'agent
        if: steps.issue.outputs.skip != 'true'
        env:
          PROMPT_BODY: ${{ steps.prompt.outputs.body }}
        run: |
          set -euo pipefail
          # pipefail est indispensable : sans lui, `| tee` renvoie le statut de
          # tee et l etape passe au vert meme si l agent a echoue. C est ce qui
          # a masque un echec total de l agent lors du premier vrai build.
          ~/.opencode/bin/opencode run \
            --agent factory-build \
            --model omniroute/agnes/agnes-2.5-flash \
            "$PROMPT_BODY" 2>&1 | tee agent-output.log

      - name: Valider et ouvrir la pull request
        if: steps.issue.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          BRANCH: ${{ steps.issue.outputs.branch }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = async (cmd, args) =>
              await exec.getExecOutput(cmd, args, { ignoreReturnCode: true });

            // Le checkout est en `persist-credentials: false` : aucun credential
            // n est ecrit dans .git/config, ce qui est voulu sur un runner
            // self-hosted, ou rien de sensible ne doit survivre au job. Le push
            // a donc besoin de son propre credential, fourni au seul processus
            // `git push` via GIT_CONFIG_* : rien n est ecrit sur le disque, et
            // le header d autorisation ne peut fuiter ni par `git remote -v` ni
            // par le journal du runner.
            const gitAuthEnv = () => ({
              GIT_CONFIG_COUNT: '1',
              GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader',
              GIT_CONFIG_VALUE_0: 'AUTHORIZATION: basic ' +
                Buffer.from('x-access-token:' + process.env.GITHUB_TOKEN).toString('base64'),
            });
            const pushBranch = async (ref) => await exec.getExecOutput(
              'git', ['push', '--force', 'origin', ref],
              { ignoreReturnCode: true, env: { ...process.env, ...gitAuthEnv() } },
            );

            // Le runner n a aucune identite git, et on ne veut rien laisser
            // derriere dans sa config : l identite est passee a la seule
            // commande qui en a besoin, le commit. L auteur est le compte
            // Actions, donc la pull request reste rattachee au run qui l a
            // produite plutot qu a une identite de machine.
            const gitAs = (...args) => ['-c', 'user.name=github-actions[bot]',
              '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
              ...args];

            // Aucun `git commit` ne doit etre ignore. Un commit qui echoue en
            // silence, suivi d un push qui n a rien pousser, donne un message
            // trompeur trois lignes plus loin.
            const must = async (args, label) => {
              const r = await run('git', args);
              if (r.exitCode !== 0) {
                core.info(r.stdout);
                core.info(r.stderr);
                await core.setFailed(label);
                return false;
              }
              return true;
            };

            const status = await run('git', ['status', '--porcelain']);
            core.info(status.stdout);

            // Le journal de l'agent est ecrit dans l arbre de travail par le
            // `| tee`, et il est retire du commit plus bas. Il ne doit donc pas
            // compter comme une modification, sinon tout run qui reussit est
            // rejete comme hors perimetre.
            const HARNESS = ['agent-output.log'];
            const touched = status.stdout.split('\n').map(l => l.slice(3).trim())
              .filter(p => p && !HARNESS.includes(p));
            if (!touched.length) {
              await core.setFailed("Aucune modification : voir agent-output.log.");
              return;
            }

            // Le perimetre autorise est fixe par l'agent. On le verifie ici
            // aussi : une pull request ne doit pas pouvoir toucher la CI.
            const ALLOWED = /^(automations|scripts|scenes|blueprints)\//;
            const ALLOWED_FILES = new Set(['templates.yaml', 'input_numbers.yaml', 'aarlo.yaml']);
            const refused = touched.filter(p => !ALLOWED.test(p) && !ALLOWED_FILES.has(p));
            if (refused.length) {
              await core.setFailed('Fichiers hors perimetre : ' + refused.join(', '));
              return;
            }
            core.info('Perimetre respecte : ' + touched.join(', '));

            const lint = await run('yamllint', ['--strict', '.']);
            core.info(lint.stdout);
            if (lint.exitCode !== 0) {
              await core.setFailed("yamllint --strict a echoue : rien n'est pousse.");
              return;
            }

            if (!await must(['add', '-A'], 'git add a echoue.')) { return; }
            if (!await must(['reset', '-q', 'agent-output.log'],
              'git reset a echoue.')) { return; }
            if (!await must(gitAs('commit', '-m',
              `feat: ${process.env.ISSUE_TITLE} (#${process.env.ISSUE_NUMBER})`),
              'Le commit a echoue.')) { return; }
            if (!await must(['branch', '-M', process.env.BRANCH],
              'Renommage de branche impossible.')) { return; }
            const push = await pushBranch(process.env.BRANCH);
            core.info(push.stdout);
            if (push.exitCode !== 0) {
              // L erreur de git est sur stderr : sans elle, « Push impossible »
              // ne dit rien de la cause reelle.
              core.info(push.stderr);
              await core.setFailed('Push impossible.');
              return;
            }

            const report = fs.readFileSync('agent-output.log', 'utf8').slice(-8000);
            const pull = await github.rest.pulls.create({
              ...context.repo,
              head: process.env.BRANCH,
              base: context.payload.repository.default_branch,
              title: `${process.env.ISSUE_TITLE} (#${process.env.ISSUE_NUMBER})`,
              body: [
                `Cloture #${process.env.ISSUE_NUMBER}`,
                '',
                '<!-- issue ' + process.env.ISSUE_NUMBER + ' -->',
                '',
                'Produite par la factory. **Jamais fusionnee automatiquement.**',
                '- Ne pas editer cette branche a la main : la factory la remplace.',
                '',
                '<details><summary>Rapport de l\'agent</summary>',
                '', report, '', '</details>',
              ].join('\n'),
            });
            core.info('Pull request : ' + pull.html_url);

            // Retirer l'etiquette declencheuse : l'issue est desormais suivie
            // par la pull request, pas par un second passage de l'agent.
            if (github.event_name !== 'workflow_dispatch') {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: Number(process.env.ISSUE_NUMBER),
                name: process.env.TRIGGER_LABEL,
              }).catch(() => {});
            }
