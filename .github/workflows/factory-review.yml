# Revue automatique des pull requests, en lecture seule.
#
# Le relecteur n'a ni droits d'ecriture ni permission bash (voir
# .opencode/agents/factory-review.md) : meme si le texte d'une pull request
# contenait une instruction, il ne pourrait ni modifier un fichier ni executer
# de commande. C'est pourquoi le correcteur, lui, passe par la CLI et non par
# cette action (voir factory-fix.yml).
#
# L'action opencode poste la revue. Une etape suivante en lit le verdict et
# ajoute l'etiquette `factory/needs-fix`, qui declenche factory-fix.yml.
name: Factory Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Seconde voie d'entree, utilisee par factory-fix.yml apres avoir pousse ses
  # corrections. Un push fait avec le GITHUB_TOKEN ne rededecenche aucun
  # workflow, donc la revue doit pouvoir etre relancee explicitement, sans quoi
  # la boucle s'arrete a la premiere correction. Elle permet aussi de relire
  # une pull request a la main.
  workflow_dispatch:
    inputs:
      pr:
        description: Numero de la pull request a relire
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Uniquement pour `createWorkflowDispatch`, qui declenche le correcteur.
  # `repository_dispatch` ferait le meme office mais exige `contents: write` :
  # on ne donne pas un droit d'ecriture sur le code au job le plus expose du
  # runner auto-heberge, qui porte HASS_TOKEN.
  actions: write

concurrency:
  group: factory-review-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEEDS_FIX_LABEL: factory/needs-fix
  ESCALATE_LABEL: factory/escalade
  NO_REVIEW_LABEL: factory/no-review
  MAX_ATTEMPTS: "2"

jobs:
  review:
    name: Revue
    # Le runner auto-heberge herite HASS_TOKEN, qui pilote la maison. On refuse
    # donc tout code provenant d'un fork : les forks n'executent que le CI
    # inerte (yamllint + check_config).
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ha-factory]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # Sur un pull_request, `github.ref` est deja le merge ref. Sur un
          # dispatch il n y a pas de ref implicite : on vise donc le merge ref
          # explicitement, sinon on relirait `main` au lieu de la pull request.
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/merge', inputs.pr) || github.ref }}

      # Les deux entrees ne portent pas la meme charge utile : `pull_request`
      # d'un cote, `inputs` de l'autre. On resout donc ici, une fois, ce dont la
      # revue a besoin, et les etapes suivantes n'utilisent plus que ces
      # sorties. Le controle anti-fork est refait depuis l'API : sur un dispatch,
      # la charge utile ne contient qu'un numero, et c'est ce numero qu'il faut
      # croire avant d'aller chercher la branche.
      - name: Resoudre la pull request
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs?.pr)
              : context.payload.pull_request?.number;
            if (!Number.isInteger(number) || number <= 0) {
              await core.setFailed('Numeros de pull request introuvable dans l evenement.');
              return;
            }
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });
            if (data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              await core.setFailed('Refus : la branche de la pull request vient d un fork.');
              return;
            }
            const labels = (data.labels ?? []).map(l => l.name);
            const skip = labels.includes(process.env.NO_REVIEW_LABEL);
            core.setOutput('pr', String(number));
            core.setOutput('title', data.title);
            core.setOutput('head_ref', data.head.ref);
            core.setOutput('base_ref', data.base.ref);
            core.setOutput('attempts',
              String(labels.filter(l => /^factory\/attempt-\d+$/.test(l)).length));
            core.setOutput('skip', skip ? 'true' : 'false');
            core.info(`PR #${number} (${data.head.ref}).`);
            if (skip) core.info('Etiquette ' + process.env.NO_REVIEW_LABEL + ' : revue ignoree.');

      # Les variables OmniRoute ne sont pas exportees ici : elles sont deja
      # dans l'environnement du runner, injectees par son
      # /etc/ha-factory/runner.env via systemd EnvironmentFile.
      - name: Charger le prompt de revue
        id: prompt
        run: |
          set -euo pipefail
          {
            echo "Contexte de la pull request :"
            echo "- Numero : ${PR_NUMBER}"
            echo "- Titre : ${PR_TITLE}"
            echo "- Branche : ${PR_HEAD}"
            echo
            cat .github/prompts/review.md
          } > /tmp/prompt.txt
          # GITHUB_OUTPUT est ligne par ligne : une valeur multiligne doit
          # utiliser la forme here-document, sinon seul le premier ligne est lu.
          {
            echo 'value<<FACTORY_PROMPT_EOF'
            cat /tmp/prompt.txt
            echo 'FACTORY_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          PR_TITLE: ${{ steps.resolve.outputs.title }}
          PR_HEAD: ${{ steps.resolve.outputs.head_ref }}

      # L action fait `git fetch` sur la branche de la PR, avec les credentials
      # ambiants. Le checkout etant en `persist-credentials: false`, il n y en a
      # aucun, et le fetch echoue sur « could not read Username for
      # https://github.com ». On ne reactive pas persist-credentials : le token
      # se retrouverait dans .git/config, que le relecteur peut lire (il a
      # `read: allow` et lit du texte non fiable). L authentification passe donc
      # par GIT_CONFIG_*, que git lit dans l environnement : elle vaut pour les
      # git de l action, et reste hors de portee d un agent sans bash.
      - name: Fournir un credential git a l'action
        run: |
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=$header"
          } >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Revue par l'agent
        if: steps.resolve.outputs.skip != 'true'
        uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4  # github-v1.2.25
        env:
          # L'action documente `use_github_token: true` comme « uses the
          # GITHUB_TOKEN env var », mais sa source lit `process.env["TOKEN"]`
          # (index.ts:342) et ne consulte jamais USE_GITHUB_TOKEN. Avec le seul
          # GITHUB_TOKEN, l'action retombait sur l'echange OIDC de l'App
          # opencode, puis verifiait les droits du collaborateur
          # `github-actions[bot]`, qui n'en a aucun : « User
          # github-actions[bot] does not have write permissions ». Et le
          # rapport, poste avec un token inutilisable, finissait en
          # « Resource not accessible by integration ». TOKEN est la variable
          # que le code lit reellement, pour le controle de droits comme pour
          # l'appel a l'API.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: omniroute/agnes/agnes-2.5-flash
          use_github_token: true
          share: false
          prompt: ${{ steps.prompt.outputs.value }}

      - name: Appliquer le verdict
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          ATTEMPTS: ${{ steps.resolve.outputs.attempts }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
        with:
          script: |
            const pr = { owner: context.repo.owner, repo: context.repo.repo,
                         issue_number: Number(process.env.PR_NUMBER) };
            const { fetchAll } = require('./.github/scripts/gh-pages.cjs');
            const comments = await fetchAll(github.rest.issues.listComments, pr);
            const last = comments[comments.length - 1];
            if (!last) {
              core.warning('Aucun commentaire de revue : aucune etiquette posee.');
              return;
            }
            const body = last.body ?? '';
            const blocking = body.includes('VERDICT: BLOQUANT');
            const max = Number(process.env.MAX_ATTEMPTS);
            const attempts = Number(process.env.ATTEMPTS);

            if (!blocking) {
              await github.rest.issues.removeLabel({ ...pr, name: process.env.NEEDS_FIX_LABEL })
                .catch(() => {});
              core.info('Verdict OK.');
              return;
            }
            if (attempts >= max) {
              await github.rest.issues.addLabels({ ...pr, labels: [process.env.ESCALATE_LABEL] });
              core.warning(`${attempts} correction(s) deja faite(s) : escalade humaine.`);
              return;
            }
            await github.rest.issues.addLabels({ ...pr, labels: [process.env.NEEDS_FIX_LABEL] });
            core.info(`Etiquette ${process.env.NEEDS_FIX_LABEL} posee.`);

            // Poser l'etiquette ne suffit pas a demarrer factory-fix : cette
            // etape tourne avec le GITHUB_TOKEN du depot, et GitHub ignore les
            // evenements qu'il emet, sauf workflow_dispatch et
            // repository_dispatch. Le `pull_request: labeled` ne sera donc
            // jamais delivre, et l'etiquette seule ne declenche rien.
            //
            // On declenche donc en plus factory-fix par workflow_dispatch.
            // L'etiquette reste posee pour la visibilite humaine et pour le
            // compte des essais.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'factory-fix.yml',
              // La version du workflow qui s'execute est celle de la branche
              // de base : la branche de la pull request peut porter une
              // definition plus ancienne, et le job checkout de toute facon sa
              // branche explicitement.
              ref: process.env.BASE_REF,
              inputs: { pr: String(pr.issue_number) },
            });
            core.info('factory-fix declenche par workflow_dispatch.');
