# Revue automatique des pull requests, en lecture seule.
#
# Le relecteur n'a ni droits d'ecriture ni permission bash (voir
# .opencode/agents/factory-review.md) : meme si le texte d'une pull request
# contenait une instruction, il ne pourrait ni modifier un fichier ni executer
# de commande. C'est pourquoi le correcteur, lui, passe par la CLI et non par
# cette action (voir factory-fix.yml).
#
# L'action opencode poste la revue. Une etape suivante en lit le verdict et
# ajoute l'etiquette `factory/needs-fix`, qui declenche factory-fix.yml.
name: Factory Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: factory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEEDS_FIX_LABEL: factory/needs-fix
  ESCALATE_LABEL: factory/escalade
  NO_REVIEW_LABEL: factory/no-review
  MAX_ATTEMPTS: "2"

jobs:
  review:
    name: Revue
    # Le runner auto-heberge herite HASS_TOKEN, qui pilote la maison. On refuse
    # donc tout code provenant d'un fork : les forks n'executent que le CI
    # inerte (yamllint + check_config).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ha-factory]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Les variables OmniRoute ne sont pas exportees ici : elles sont deja
      # dans l'environnement du runner, injectees par son
      # /etc/ha-factory/runner.env via systemd EnvironmentFile.
      - name: Charger le prompt de revue
        id: prompt
        run: |
          set -euo pipefail
          {
            echo "Contexte de la pull request :"
            echo "- Numero : ${PR_NUMBER}"
            echo "- Titre : ${PR_TITLE}"
            echo "- Branche : ${PR_HEAD}"
            echo
            cat .github/prompts/review.md
          } > /tmp/prompt.txt
          # GITHUB_OUTPUT est ligne par ligne : une valeur multiligne doit
          # utiliser la forme here-document, sinon seul le premier ligne est lu.
          {
            echo 'value<<FACTORY_PROMPT_EOF'
            cat /tmp/prompt.txt
            echo 'FACTORY_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}

      - name: Verifier l'etiquette d'exclusion
        id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const labels = (context.payload.pull_request?.labels ?? []).map(l => l.name);
            const skip = labels.includes(process.env.NO_REVIEW_LABEL);
            core.setOutput('skip', skip ? 'true' : 'false');
            if (skip) core.info('Etiquette ' + process.env.NO_REVIEW_LABEL + ' : revue ignoree.');

      # L action fait `git fetch` sur la branche de la PR, avec les credentials
      # ambiants. Le checkout etant en `persist-credentials: false`, il n y en a
      # aucun, et le fetch echoue sur « could not read Username for
      # https://github.com ». On ne reactive pas persist-credentials : le token
      # se retrouverait dans .git/config, que le relecteur peut lire (il a
      # `read: allow` et lit du texte non fiable). L authentification passe donc
      # par GIT_CONFIG_*, que git lit dans l environnement : elle vaut pour les
      # git de l action, et reste hors de portee d un agent sans bash.
      - name: Fournir un credential git a l'action
        run: |
          set -euo pipefail
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          {
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader"
            echo "GIT_CONFIG_VALUE_0=$header"
          } >> "$GITHUB_ENV"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Revue par l'agent
        if: steps.guard.outputs.skip != 'true'
        uses: anomalyco/opencode/github@a3b97d9090ccf4aa9ac32268486283e3131e36b4  # github-v1.2.25
        env:
          # L'action documente `use_github_token: true` comme « uses the
          # GITHUB_TOKEN env var », mais sa source lit `process.env["TOKEN"]`
          # (index.ts:342) et ne consulte jamais USE_GITHUB_TOKEN. Avec le seul
          # GITHUB_TOKEN, l'action retombait sur l'echange OIDC de l'App
          # opencode, puis verifiait les droits du collaborateur
          # `github-actions[bot]`, qui n'en a aucun : « User
          # github-actions[bot] does not have write permissions ». Et le
          # rapport, poste avec un token inutilisable, finissait en
          # « Resource not accessible by integration ». TOKEN est la variable
          # que le code lit reellement, pour le controle de droits comme pour
          # l'appel a l'API.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: omniroute/agnes/agnes-2.5-flash
          use_github_token: true
          share: false
          prompt: ${{ steps.prompt.outputs.value }}

      - name: Appliquer le verdict
        if: steps.guard.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = { owner: context.repo.owner, repo: context.repo.repo,
                         issue_number: context.issue.number };
            const { fetchAll } = require('./.github/scripts/gh-pages.cjs');
            const comments = await fetchAll(github.rest.issues.listComments, pr);
            const last = comments[comments.length - 1];
            if (!last) {
              core.warning('Aucun commentaire de revue : aucune etiquette posee.');
              return;
            }
            const body = last.body ?? '';
            const blocking = body.includes('VERDICT: BLOQUANT');
            const max = Number(process.env.MAX_ATTEMPTS);
            const labels = (context.payload.pull_request?.labels ?? []).map(l => l.name);
            const attempts = labels.filter(l => /^factory\/attempt-\d+$/.test(l)).length;

            if (!blocking) {
              await github.rest.issues.removeLabel({ ...pr, name: process.env.NEEDS_FIX_LABEL })
                .catch(() => {});
              core.info('Verdict OK.');
              return;
            }
            if (attempts >= max) {
              await github.rest.issues.addLabels({ ...pr, labels: [process.env.ESCALATE_LABEL] });
              core.warning(`${attempts} correction(s) deja faite(s) : escalade humaine.`);
              return;
            }
            await github.rest.issues.addLabels({ ...pr, labels: [process.env.NEEDS_FIX_LABEL] });
            core.info(`Etiquette ${process.env.NEEDS_FIX_LABEL} posee.`);
