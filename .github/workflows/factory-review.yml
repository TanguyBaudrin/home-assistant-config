# Revue automatique des pull requests, en lecture seule.
#
# Le relecteur n'a ni droits d'ecriture ni permission bash (voir
# .opencode/agents/factory-review.md) : meme si le texte d'une pull request
# contenait une instruction, il ne pourrait ni modifier un fichier ni executer
# de commande. C'est pourquoi le correcteur, lui, passe par la CLI et non par
# cette action (voir factory-fix.yml).
#
# LA REVUE PASSE ELLE AUSSI PAR LA CLI. L'action opencode appelle
# `assertPermissions()`, qui interroge le niveau de collaborateur de
# `github.actor` — l'utilisateur qui a declenche l'evenement, et non le jeton
# qu'elle s'apprete a utiliser :
#
#     const { actor } = useContext()
#     octoRest.repos.getCollaboratorPermissionLevel({ ..., username: actor })
#     if (!["admin","write"].includes(permission)) throw new Error(...)
#
# Or toutes les pull requests de ce depot sont ouvertes par `factory-build`,
# donc `github.actor` vaut `github-actions[bot]`, qui n'est pas collaborateur :
# l'API repond `permission: none` et la revue echoue. C'est deterministe, pas
# une alea : le run 36621085953 (ouvert par un humain) est passe avec
# `permission: admin`, les runs 36621537561 et 36672422851 (ouverts par
# l'usine) ont echoue avec `permission: none`. `TOKEN` ne corrigeait rien :
# `useEnvGithubToken()` lit `process.env["TOKEN"]`, mais `github/action.yml` ne
# le transmet pas dans son bloc `env:` et n'affiche jamais « skipped (using
# github token) » — le controle passait donc toujours par l'API.
#
# Pire, l'echec etait silencieux : l'action poste quand meme son message
# d'erreur en commentaire de revue, et l'etape suivante saute, donc aucune
# etiquette n'est posee et le correcteur ne part jamais. La boucle
# revue/correction etait inerte sur toutes les pull requests produites par
# l'usine, sans qu'aucun signal ne le dise.
#
# La CLI supprime ce controle par construction, supprime le header
# `GIT_CONFIG_*` qui n'existait que pour le `git fetch` de l'action, et rend la
# revue a l'identique du correcteur.
#
# Le relecteur poste lui-meme sa revue en commentaire, via une etape
# github-script : il n'a pas de droit d'ecriture sur la pull request.
name: Factory Review

on:
  # Une seule voie d'entree. `workflow_dispatch` a ete essaye, puis retire :
  # l'action opencode tire l'identifiant de son commentaire de
  # `payload.issue.number`, absent d'une charge utile de dispatch, et elle ne
  # poste donc rien (run 36622093227). Relire une pull request a la main se fait
  # en poussant un commit vide, ou en fermant puis rouvrant la pull request.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # Uniquement pour `createWorkflowDispatch`, qui declenche le correcteur.
  # `repository_dispatch` ferait le meme office mais exige `contents: write` :
  # on ne donne pas un droit d'ecriture sur le code au job le plus expose du
  # runner auto-heberge, qui porte HASS_TOKEN.
  actions: write

concurrency:
  group: factory-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NEEDS_FIX_LABEL: factory/needs-fix
  ESCALATE_LABEL: factory/escalade
  NO_REVIEW_LABEL: factory/no-review
  MAX_ATTEMPTS: "2"
  # CLI epinglee : sans --version le script d'installation telecharge la
  # derniere version, qui peut casser le frontmatter d'un agent.
  OPENCODE_VERSION: "1.18.33"

jobs:
  review:
    name: Revue
    # Le runner auto-heberge herite HASS_TOKEN, qui pilote la maison. On refuse
    # donc tout code provenant d'un fork : les forks n'executent que le CI
    # inerte (yamllint + check_config).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ha-factory]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # La charge utile d'un `pull_request` porte la pull request, mais pas la
      # liste de ses etiquettes ni son numero d'essai. On resout donc ici, une
      # fois, ce dont la revue a besoin, et les etapes suivantes n'utilisent
      # plus que ces sorties. Le controle anti-fork est refait depuis l'API :
      # `if:` lit la charge utile brute, et c'est la branche resolue par
      # l'API qui fait foi.
      #
      # Le diff est resolu ICI, et pas par l'agent : `factory-review` a
      # `bash: deny`, il ne peut donc pas lancer `git diff`. Le prompt lui
      # annoncait pourtant « l'outil de recherche de differences » (review.md),
      # qui n'existe ni dans l'action ni dans la CLI : c'etait un mirage, et
      # l'agent ne pouvait inspecter que l'arbre de travail deja coché. On lui
      # fournit donc le diff, ainsi que la liste des fichiers touches.
      #
      # L'etape d'apres cocheck la branche de la pull request, pour que
      # l'agent lise les fichiers de la PR et non ceux de la base.
      - name: Resoudre la pull request et son diff
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            // `exec` est deja fourni par actions/github-script : le declarer
            // ici leve « SyntaxError: Identifier 'exec' has already been
            // declared » (run 36673497099).
            const number = context.payload.pull_request?.number;
            if (!Number.isInteger(number) || number <= 0) {
              await core.setFailed('Numeros de pull request introuvable dans l evenement.');
              return;
            }
            const { data } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: number,
            });
            if (data.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              await core.setFailed('Refus : la branche de la pull request vient d un fork.');
              return;
            }
            const labels = (data.labels ?? []).map(l => l.name);
            const skip = labels.includes(process.env.NO_REVIEW_LABEL);
            core.setOutput('pr', String(number));
            core.setOutput('title', data.title);
            core.setOutput('head_ref', data.head.ref);
            core.setOutput('base_ref', data.base.ref);
            core.setOutput('attempts',
              String(labels.filter(l => /^factory\/attempt-\d+$/.test(l)).length));
            core.setOutput('skip', skip ? 'true' : 'false');
            core.info(`PR #${number} (${data.head.ref}).`);
            if (skip) core.info('Etiquette ' + process.env.NO_REVIEW_LABEL + ' : revue ignoree.');

            // `git diff` compare des commits, pas des noms de branches : les deux
            // SHA doivent etre presents localement. Le checkout initial a bien
            // `fetch-depth: 0`, mais il ne porte que la base.
            for (const ref of [data.head.sha, data.base.sha]) {
              const r = await exec.getExecOutput('git', ['fetch', '--no-tags', 'origin', ref],
                { ignoreReturnCode: true });
              if (r.exitCode !== 0) {
                await core.setFailed(`git fetch de ${ref.slice(0, 7)} a echoue : `
                  + r.stderr.trim());
                return;
              }
            }

            // Un diff tronque ferait passer une suppression de masse pour un
            // changement benin : on mesure, et on avertit plutot que d'agir
            // sur un diff incomplet.
            const diff = await exec.getExecOutput(
              'git', ['diff', '--no-color', data.base.sha, data.head.sha],
              { ignoreReturnCode: true },
            );
            if (diff.exitCode !== 0) {
              await core.setFailed('git diff a echoue : ' + diff.stderr.trim());
              return;
            }
            const files = await exec.getExecOutput(
              'git', ['diff', '--name-only', data.base.sha, data.head.sha],
              { ignoreReturnCode: true },
            );
            core.setOutput('diff', diff.stdout);
            core.setOutput('files', files.stdout.trim() || '(aucun)');
            core.info(`Diff : ${diff.stdout.length} car., `
              + `${files.stdout.trim().split('\n').filter(Boolean).length} fichier(s).`);
            if (diff.stdout.length > 200000) {
              core.warning('Diff volumineux : la revue peut etre partielle.');
            }

      # Les variables OmniRoute ne sont pas exportees ici : elles sont deja
      # dans l'environnement du runner, injectees par son
      # /etc/ha-factory/runner.env via systemd EnvironmentFile.
      - name: Charger le prompt de revue
        id: prompt
        run: |
          set -euo pipefail
          {
            echo "Contexte de la pull request :"
            echo "- Numero : ${PR_NUMBER}"
            echo "- Titre : ${PR_TITLE}"
            echo "- Branche : ${PR_HEAD}"
            echo
            echo "Fichiers modifies :"
            echo "${PR_FILES}"
            echo
            echo "Diff (base -> pull request) :"
            echo '```diff'
            printf '%s\n' "${PR_DIFF}"
            echo '```'
            echo
            cat .github/prompts/review.md
          } > /tmp/prompt.txt
          # GITHUB_OUTPUT est ligne par ligne : une valeur multiligne doit
          # utiliser la forme here-document, sinon seule la premiere ligne est
          # lue.
          {
            echo 'value<<FACTORY_PROMPT_EOF'
            cat /tmp/prompt.txt
            echo 'FACTORY_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          PR_TITLE: ${{ steps.resolve.outputs.title }}
          PR_HEAD: ${{ steps.resolve.outputs.head_ref }}
          PR_FILES: ${{ steps.resolve.outputs.files }}
          # Un diff contient des backslashes et des dollars : le passer par
          # l'environnement evite toute reinterpretation par le shell.
          PR_DIFF: ${{ steps.resolve.outputs.diff }}

      # CLI epinglee : sans --version le script d'installation telecharge la
      # derniere version, qui peut casser le frontmatter d'un agent.
      - name: Installer opencode
        id: install
        run: |
          set -euo pipefail
          mkdir -p ~/.opencode/bin
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$OPENCODE_VERSION"
          echo "installed=$(~/.opencode/bin/opencode --version)" >> "$GITHUB_OUTPUT"

      # L'arbre de travail doit contenir la pull request, pas la base : le
      # relecteur n'a que `read`, `glob` et `grep`, et lit donc des fichiers
      # reels. L'action le faisait par `git fetch` + `git checkout` de la
      # branche, avec un header d'autorisation passe par l'environnement
      # (`GIT_CONFIG_*`) parce que le checkout est en
      # `persist-credentials: false`. Ce header n'existait que pour le
      # `git fetch` de l'action : la revue ne pousse rien, il disparait avec
      # elle.
      - name: Checkout la branche de la pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ steps.resolve.outputs.head_ref }}
          fetch-depth: 0

      # Les variables OmniRoute ne sont pas exportees ici : elles sont deja
      # dans l'environnement du runner, injectees par son
      # /etc/ha-factory/runner.env via systemd EnvironmentFile.
      #
      # Meme forme que le correcteur (voir factory-fix.yml) : pas d'`agent:`,
      # le choix se fait par `--agent`. `GITHUB_TOKEN` n'est pas passe a
      # l'agent : le relecteur n'a aucune permission d'ecriture, et il n'a pas
      # a appeler l'API. Il rend sa revue sur sa sortie standard.
      # Le retry est ici pour la meme raison que dans factory-spec.yml : l'agent
      # est en lecture seule, il ne modifie rien, donc le repeter ne peut pas
      # doubler un effet. Ce n'est pas vrai du correcteur, qui ecrit et commite.
      # Le run 36673610734 a echoue sur « Service temporarily unavailable due to
      # resource pressure » alors que l'agent avait deja lu ses fichiers de
      # reference : une panne de fournisseur, pas un probleme de revue, et elle
      # ne justifiait pas un run rouge.
      - name: Revue par l'agent
        if: steps.resolve.outputs.skip != 'true'
        env:
          PROMPT_BODY: ${{ steps.prompt.outputs.value }}
          AGENT_ATTEMPTS: "3"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 "$AGENT_ATTEMPTS"); do
            # pipefail est indispensable : sans lui, `| tee` renvoie le statut
            # de tee et l'etape passe au vert meme si l'agent a echoue.
            if ~/.opencode/bin/opencode run \
                 --agent factory-review \
                 --model omniroute/agnes/agnes-2.5-flash \
                 "$PROMPT_BODY" 2>&1 | tee agent-output.log; then
              exit 0
            fi
            echo "::warning::La revue a echoue (essai ${attempt}/${AGENT_ATTEMPTS})."
            if [ "$attempt" -lt "$AGENT_ATTEMPTS" ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::La revue a echoue ${AGENT_ATTEMPTS} fois de suite."
          exit 1

      # L'action posait elle-meme le commentaire. La CLI ne le fait pas : c'est
      # cette etape qui publie la sortie de l'agent, et qui y ajoute le lien
      # vers le run. Ce lien n'est pas cosmetique, `Appliquer le verdict`
      # reconnait le commentaire de CE run a travers lui, et refuse d'agir si
      # aucun ne correspond.
      #
      # `always()` : l'echec de la revue doit laisser une trace. Sans ca, un
      # agent qui n'a rien rendu produirait un run rouge sans commentaire, et
      # l'absence de commentaire se lirait comme un silence volontaire. Le lien
      # de run reste present dans les deux cas, pour que `Appliquer le verdict`
      # refuse toujours d'agir sur une absence de verdict.
      #
      # L'etape se garde aussi quand le numero de pull request est inconnu —
      # cas d'un echec de `Resoudre la pull request` (run 36673497099). Elle
      # n'alors rien a poster, et le rendrait en echec pour rien.
      - name: Publier la revue
        if: always() && steps.resolve.outputs.skip != 'true' && steps.resolve.outputs.pr != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          PR_TITLE: ${{ steps.resolve.outputs.title }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const pr = { owner: context.repo.owner, repo: context.repo.repo,
                         issue_number: Number(process.env.PR_NUMBER) };
            let raw = '';
            try {
              raw = fs.readFileSync('agent-output.log', 'utf8');
            } catch {
              raw = '';
            }

            // La sortie de la CLI melange le rapport et la trace d'execution :
            // barre de titre `> factory-review · modele`, puis une ligne par
            // appel d'outil (`Read automations/...`, `Glob ... 20 matches`).
            // Au run 36673827000 ces lignes faisaient 1189 caracteres sur 3066,
            // soit 38% du commentaire publie, et la vraie revue arrivait en
            // troisieme.
            //
            // On ne peut pas tronquer a partir du VERDICT : le verdict est la
            // derniere ligne, on perdrait tout le rapport.
            //
            // La trace est un bloc continu qui precede le rapport, et chaque
            // ligne y nomme un outil derriere un glyphe d'activite. On la
            // supprime donc en tete de sortie, tant qu'on la reconnait — et on
            // s'arrete au premier signe de rapport, des qu'un titre Markdown,
            // un VERDICT, ou deux lignes de texte suivi, le signalent. Une
            // puce de rapport (`* point`) ne nomme pas d'outil et ne declenche
            // donc rien, contrairement a un motif trop permissif.
            const ANSI = String.fromCharCode(27);
            const ansiRe = new RegExp(`${ANSI}\\[[0-9;]*[A-Za-z]`, 'g');
            const stripAnsi = (s) => s.replace(ansiRe, '');
            const TOOL = /\b(?:Read|Write|Edit|Glob|Grep|List|Bash|WebFetch|Task)\b/;
            const lines = raw.split('\n');
            let i = 0;
            for (; i < lines.length; i++) {
              const bare = stripAnsi(lines[i]);
              if (!bare.trim()) continue;                 // lignes vides : transparent
              if (/^\s*(?:#{1,6}\s|\*\*VERDICT)/.test(bare)) break;  // debut du rapport
              // La puce Markdown est testee AVANT le nom d'outil. Dans l'ordre
              // inverse, une puce de rapport qui cite `Read automations/x.yaml`
              // — ce que fait un relecteur, puisque le rapport cite
              // `fichier:ligne` — etait supprimee comme si c'etait de la trace.
              if (/^\s*[*+-]\s/.test(bare)) break;         // puce de rapport
              if (TOOL.test(bare)) continue;              // ligne de trace
              if (/^\s*(?:>|→|⇒|✱|✔|✖|·)\s*\S/.test(bare)) continue;  // titre de trace
              break;                                      // texte courant
            }
            const report = lines.slice(i).join('\n');
            // Les codes d'echappement restants sont du bruit de terminal dans
            // un commentaire GitHub.
            const clean = report.replace(ansiRe, '').replace(/^\n+/, '').trim();

            if (!clean || !/VERDICT:/.test(clean)) {
              await github.rest.issues.createComment({
                ...pr,
                body: `## Revue automatique — aucune revue produite\n\n`
                  + `L'agent s'est arrete sans rendre de verdict. A verifier manuellement.\n\n`
                  + `[github run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`
                  + `/actions/runs/${process.env.RUN_ID})`,
              });
              core.warning('Aucun VERDICT dans la sortie de l agent.');
              return;
            }
            await github.rest.issues.createComment({
              ...pr,
              body: `## Revue de la pull request #${pr.issue_number}`
                + ` — ${process.env.PR_TITLE}\n\n${clean}\n\n---\n`
                + `[github run](${context.serverUrl}`
                + `/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID})`,
            });
            core.info('Revue publiee.');

      - name: Appliquer le verdict
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          ATTEMPTS: ${{ steps.resolve.outputs.attempts }}
          BASE_REF: ${{ steps.resolve.outputs.base_ref }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const pr = { owner: context.repo.owner, repo: context.repo.repo,
                         issue_number: Number(process.env.PR_NUMBER) };
            const { fetchAll } = require('./.github/scripts/gh-pages.cjs');
            const comments = await fetchAll(github.rest.issues.listComments, pr);

            // Chercher le DERNIER commentaire n'est pas lire son verdict. Deux
            // raisons, et la seconde a deja produit un faux « Verdict OK » :
            //
            // - une etape qui echoue, ou un agent qui n'a rien rendu, laisse
            //   derriere elle un commentaire sans `VERDICT:`. C'est ce qui s'est
            //   produit au run 36621537561, dont le commentaire ne contient que
            //   « User github-actions[bot] does not have write permissions » ;
            // - une etiquette posee a la main, ou le correcteur, commentent
            //   aussi, et passent donc devant la revue.
            //
            // `Publier la revue` ajoute un lien vers son run a chaque
            // commentaire qu'elle poste, y compris a celui qui signale une
            // revue manquante. On ne retient donc que le commentaire de CE run,
            // et on refuse d'agir si le verdict n'y est pas : mieux vaut une
            // pull request sans etiquette qu'une etiquette fausse.
            const mine = comments.filter(c =>
              (c.body ?? '').includes(`/actions/runs/${process.env.RUN_ID}`));
            const body = mine.length ? (mine[mine.length - 1].body ?? '') : '';
            const verdict = body.match(/VERDICT:\s*(OK|BLOQUANT)/)?.[1];
            if (!verdict) {
              core.warning(
                `Aucun verdict de revue pour le run ${process.env.RUN_ID} `
                + `(${comments.length} commentaire(s), ${mine.length} pour ce run) : `
                + 'aucune etiquette posee.');
              return;
            }
            const blocking = verdict === 'BLOQUANT';
            const max = Number(process.env.MAX_ATTEMPTS);
            const attempts = Number(process.env.ATTEMPTS);

            if (!blocking) {
              await github.rest.issues.removeLabel({ ...pr, name: process.env.NEEDS_FIX_LABEL })
                .catch(() => {});
              core.info('Verdict OK.');
              return;
            }
            if (attempts >= max) {
              await github.rest.issues.addLabels({ ...pr, labels: [process.env.ESCALATE_LABEL] });
              core.warning(`${attempts} correction(s) deja faite(s) : escalade humaine.`);
              return;
            }
            await github.rest.issues.addLabels({ ...pr, labels: [process.env.NEEDS_FIX_LABEL] });
            core.info(`Etiquette ${process.env.NEEDS_FIX_LABEL} posee.`);

            // Poser l'etiquette ne suffit pas a demarrer factory-fix : cette
            // etape tourne avec le GITHUB_TOKEN du depot, et GitHub ignore les
            // evenements qu'il emet, sauf workflow_dispatch et
            // repository_dispatch. Le `pull_request: labeled` ne sera donc
            // jamais delivre, et l'etiquette seule ne declenche rien.
            //
            // On declenche donc en plus factory-fix par workflow_dispatch.
            // L'etiquette reste posee pour la visibilite humaine et pour le
            // compte des essais.
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'factory-fix.yml',
              // La version du workflow qui s'execute est celle de la branche
              // de base : la branche de la pull request peut porter une
              // definition plus ancienne, et le job checkout de toute facon sa
              // branche explicitement.
              ref: process.env.BASE_REF,
              inputs: { pr: String(pr.issue_number) },
            });
            core.info('factory-fix declenche par workflow_dispatch.');
