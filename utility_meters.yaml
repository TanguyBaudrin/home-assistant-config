# Utility meters for energy consumption and cost tracking per device
# Excludes Linky devices as requested
# Each meter tracks consumption by tariff period (Bleu/Blanc/Rouge × HC/HP)

# ============================================
# Box Internet
# ============================================
box_internet_energy:
  source: sensor.box_internet_consommation
  cycle: daily
  tariffs:
    - bleu_hc
    - bleu_hp
    - blanc_hc
    - blanc_hp
    - rouge_hc
    - rouge_hp

